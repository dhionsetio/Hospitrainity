<!DOCTYPE html>
<!--__HSP_PROVENANCE__-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="hospitrainity-checkpoint" content="CP-14">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospitrainity — Hospitality English</title>
<style>
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#FBFBFA;
  --text:#2C2C2B; --text-soft:#4A4A47; --text-mute:#6C6C67;
  --border:#E8E7E3; --border-strong:#D3D2CD;
  --brand:#3F38C7; --brand-soft:#EEF0FF; --brand-strong:#312BA0;
  --green:#1F7A4D; --green-soft:#E6F3EC; --amber:#8A5A00; --amber-soft:#FBF0D9;
  --blue:#1F5FA8; --blue-soft:#E7F0FA;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(20,20,20,.05),0 6px 20px rgba(20,20,20,.05);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
a{color:var(--brand-strong);text-decoration:underline;text-underline-offset:2px}
a:hover{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:#fff;padding:10px 16px;border-radius:0 0 8px 0;z-index:100;text-decoration:none}
.skip:focus{left:0}
.app-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1080px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;text-decoration:none;color:var(--text)}
.brand-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#6D28D9);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--text-mute);letter-spacing:.03em;text-transform:uppercase}
.header-spacer{flex:1}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-links a{font-size:13.5px;font-weight:600;color:var(--text-soft);padding:7px 12px;border-radius:999px;text-decoration:none}
.nav-links a:hover{background:var(--surface-2);color:var(--text)}
.nav-links a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong)}
.container{max-width:1080px;margin:0 auto;padding:30px 22px 90px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-mute);margin-bottom:18px;flex-wrap:wrap}
.crumb .sep{opacity:.5}
.hero{background:linear-gradient(135deg,#3F38C7 0%,#5B21B6 60%,#6D28D9 100%);border-radius:20px;padding:34px 36px;color:#fff;margin-bottom:30px;box-shadow:var(--shadow)}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.hero p{font-size:15px;opacity:.94;max-width:640px}
.hero-meta{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap}
.hero-meta .m b{display:block;font-size:22px;font-weight:800}
.hero-meta .m span{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid #E9D8A6;color:var(--amber);padding:12px 15px;border-radius:var(--radius-sm);font-size:13.5px;margin-bottom:26px}
.notice svg{flex:none;margin-top:1px}
h2.section-title{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-decoration:none;color:inherit;transition:.15s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.card .kicker{font-size:11.5px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px;line-height:1.35}
.card .stats{display:flex;gap:14px;font-size:12.5px;color:var(--text-mute);font-weight:600}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text-soft);margin-bottom:18px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);text-decoration:none}
.back-link:hover{border-color:var(--border-strong);color:var(--text)}
.page-head{margin-bottom:24px}
.page-head .kicker{font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.page-head h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:800;margin-bottom:12px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0}
.badge{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft)}
.badge.brand{background:var(--brand-soft);border-color:#D6D8FA;color:var(--brand-strong)}
.badge.green{background:var(--green-soft);border-color:#BFE3CE;color:var(--green)}
.badge.blue{background:var(--blue-soft);border-color:#C4DBF0;color:var(--blue)}
.wf{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.wf th,.wf td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.wf th{font-weight:600;color:var(--text-soft)}
.olist{list-style:none;display:flex;flex-direction:column;gap:9px}
.olist li{display:flex;gap:11px;font-size:14px;color:var(--text-soft);padding:11px 13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.olist li .oc{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand);flex:none;padding-top:1px}
.sec-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.sec-list li{display:flex;align-items:center;gap:12px;font-size:14.5px;padding:12px 15px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.sec-list li .num{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}
.act-list{display:flex;flex-direction:column;gap:14px}
.act{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.act .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.act h3{font-size:16px;font-weight:700}
.act .lesson{font-size:12px;color:var(--text-mute);font-family:var(--mono);font-weight:600}
.act .act-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-strong);text-decoration:none;margin-top:12px}
.prompt{border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;background:var(--surface-2)}
.prompt .pc{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-mute);margin-bottom:6px}
.prompt .stem{font-size:14.5px;color:var(--text);font-weight:500}
details.reveal{margin-top:12px;border-top:1px dashed var(--border-strong);padding-top:10px}
details.reveal summary{font-size:13px;font-weight:700;color:var(--brand-strong);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.reveal summary::-webkit-details-marker{display:none}
details.reveal summary::before{content:'▸';font-size:11px}
details.reveal[open] summary::before{content:'▾'}
details.reveal .body{margin-top:10px;font-size:13.5px;color:var(--text-soft)}
.model-answer{background:var(--green-soft);border:1px solid #BFE3CE;border-radius:8px;padding:10px 13px;margin-bottom:8px;font-size:13.5px}
.fb{background:var(--blue-soft);border:1px solid #C4DBF0;border-radius:8px;padding:10px 13px;font-size:13.5px}
.fb .ft{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);margin-bottom:3px}
.rubric{margin-top:14px}
.rubric table{width:100%;border-collapse:collapse;font-size:13px}
.rubric th,.rubric td{text-align:left;padding:8px 10px;border:1px solid var(--border);vertical-align:top}
.rubric th{background:var(--surface-2);font-weight:700}
.prose p{margin-bottom:12px;color:var(--text-soft)}
.prose h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.prose code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:5px;border:1px solid var(--border)}
.app-footer{border-top:1px solid var(--border);margin-top:20px;padding:22px;text-align:center;font-size:12.5px;color:var(--text-mute)}
.empty{font-size:13.5px;color:var(--text-mute);font-style:italic;padding:8px 0}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to main content</a>
<header class="app-header">
  <div class="header-inner">
    <a href="#/" class="brand"><span class="brand-logo" aria-hidden="true">HI</span><span>Hospitrainity<small>Hospitality English</small></span></a>
    <div class="header-spacer"></div>
    <nav class="nav-links" aria-label="Primary">
      <a href="#/" data-nav="home">Modules</a>
      <a href="#/outcomes" data-nav="outcomes">Outcomes</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>
  </div>
</header>
<main id="main" class="container" tabindex="-1"></main>
<footer class="app-footer"></footer>
<script id="hsp-data" type="application/json">/*__HOSPITRAINITY_DATA__*/</script>
<script>
"use strict";
var DATA=JSON.parse(document.getElementById('hsp-data').textContent);
var app=document.getElementById('main');
var foot=document.querySelector('.app-footer');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function outcomeMap(){var m={};(DATA.outcomes||[]).forEach(function(o){m[o.id]=o;});return m;}
var OM=outcomeMap();
function chapterByCode(code){return (DATA.chapters||[]).filter(function(c){return c.code===code;})[0];}
function activityByCode(code){var r=null;(DATA.chapters||[]).forEach(function(c){(c.activities||[]).forEach(function(a){if(a.code===code)r={a:a,c:c};});});return r;}
function badge(txt,cls){return '<span class="badge '+(cls||'')+'">'+esc(txt)+'</span>';}
function stateLabel(st){return ({draft:'Draft',review:'In review',approved:'Approved',published:'Published',retired:'Retired'})[st]||esc(st||'draft');}
function stateCls(st){return ({review:'blue',approved:'green',published:'green'})[st]||'';}
function stateBadge(st){return badge(stateLabel(st),stateCls(st));}
function crumb(parts){return '<nav class="crumb" aria-label="Breadcrumb">'+parts.map(function(p,i){var sep=i<parts.length-1?' <span class="sep" aria-hidden="true">/</span>':'';return (p.href?'<a href="'+p.href+'">'+esc(p.label)+'</a>':'<span>'+esc(p.label)+'</span>')+sep;}).join(' ')+'</nav>';}
function viewHome(){
  var s=DATA.stats||{};
  var h='<section class="hero"><h1>'+esc(DATA.meta.title)+'</h1><p>'+esc(DATA.meta.subtitle)+'</p>'+
    '<div class="hero-meta">'+
    '<div class="m"><b>'+s.chapters+'</b><span>Modules</span></div>'+
    '<div class="m"><b>'+s.sections+'</b><span>Lesson sections</span></div>'+
    '<div class="m"><b>'+s.activities+'</b><span>Activities</span></div>'+
    '<div class="m"><b>'+s.prompts+'</b><span>Prompts</span></div>'+
    '</div></section>';
  h+=noticeBlock();
  h+='<h2 class="section-title">The seven modules</h2><div class="grid">';
  (DATA.chapters||[]).forEach(function(c){
    h+='<a class="card" href="#/chapter/'+encodeURIComponent(c.code)+'">'+
      '<div class="kicker">Module '+c.module+'</div>'+
      '<h3>'+esc(c.title)+'</h3>'+
      '<div class="badges">'+stateBadge(c.status)+'</div>'+
      '<div class="stats"><span>'+(c.sections||[]).length+' sections</span><span>'+(c.activities||[]).length+' activities</span></div>'+
      '</a>';
  });
  h+='</div>';
  return h;
}
function noticeBlock(){
  return '<div class="notice" role="note"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1L1 14h14L8 1zm0 4v4M8 11.5v.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span>'+esc(DATA.meta.notice)+'</span></div>';
}
function viewChapter(code){
  var c=chapterByCode(code);
  if(!c)return notFound();
  var h=crumb([{label:'Modules',href:'#/'},{label:'Module '+c.module}]);
  var approvalBadgeText=({draft:'Not yet submitted',review:'Approval: pending',approved:'Approved',published:'Approved & published'})[c.status]||'Approval: pending';
  var approvalBadgeCls=({approved:'green',published:'green'})[c.status]||'';
  h+='<div class="page-head"><div class="kicker">Module '+c.module+'</div><h1>'+esc(c.title)+'</h1><div class="badges">'+stateBadge(c.status)+badge(approvalBadgeText,approvalBadgeCls)+'</div></div>';
  var moduleNotice=({
    draft:'This module is in early drafting and has not yet been submitted for review.',
    review:'This module is submitted for qualified review. It is not yet approved or published; content is provisional pending sign-off.',
    approved:'This module is approved. Publication is pending.',
    published:'This module is approved and published, recorded as of the CP-14 closing phase. See the About page for the recorded sign-off basis.'
  })[c.status]||'This module\u2019s review status is provisional.';
  h+='<div class="notice" role="note" style="margin-bottom:20px"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1L1 14h14L8 1zm0 4v4M8 11.5v.5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span>'+esc(moduleNotice)+'</span></div>';
  h+='<div class="panel"><h3>Learning outcomes</h3><ul class="olist">';
  (c.outcome_codes||[]).forEach(function(oc){var o=OM[oc];h+='<li><span class="oc">'+esc(oc)+'</span><span>'+(o?esc(o.statement):'')+(o&&o.provisional_band?' '+badge('band: '+o.provisional_band):'')+'</span></li>';});
  h+='</ul></div>';
  h+='<div class="panel"><h3>Lesson sections</h3><ol class="sec-list">';
  (c.sections||[]).forEach(function(sec){h+='<li><span class="num" aria-hidden="true">'+sec.order+'</span><span>'+esc(sec.title)+'</span></li>';});
  h+='</ol></div>';
  if((c.activities||[]).length){
    h+='<h2 class="section-title">Activities &amp; assessment</h2><div class="act-list">';
    (c.activities||[]).forEach(function(a){
      h+='<article class="act"><div class="top"><h3>'+esc(a.title)+'</h3><span class="lesson">'+esc(a.lesson_code)+'</span></div>'+
        '<div class="badges">'+badge(a.cefr_activity,'brand')+badge(a.pedagogical_function.replace(/_/g,' '))+badge(a.response_form.replace(/_/g,' '))+badge(a.channel.replace(/_/g,' '))+'</div>'+
        '<a class="act-link" href="#/activity/'+encodeURIComponent(a.code)+'">Open activity ('+(a.prompts||[]).length+' prompts) →</a></article>';
    });
    h+='</div>';
  }else{
    h+='<div class="panel"><p class="empty">This introductory module has no scored activities; it establishes the customer-care outcomes practiced across the following modules.</p></div>';
  }
  return h;
}
function viewActivity(code){
  var r=activityByCode(code);
  if(!r)return notFound();
  var a=r.a,c=r.c;
  var h=crumb([{label:'Modules',href:'#/'},{label:'Module '+c.module,href:'#/chapter/'+encodeURIComponent(c.code)},{label:a.title}]);
  h+='<div class="page-head"><div class="kicker">'+esc(c.title)+' · '+esc(a.lesson_code)+'</div><h1>'+esc(a.title)+'</h1></div>';
  h+='<div class="panel"><div class="badges">'+badge('CEFR activity: '+a.cefr_activity,'brand')+badge('function: '+a.pedagogical_function.replace(/_/g,' '))+badge('response: '+a.response_form.replace(/_/g,' '))+badge('channel: '+a.channel.replace(/_/g,' '))+badge('participation: '+a.participation)+badge('scoring: '+a.scoring_mode.replace(/_/g,' '))+badge('timing: '+a.timing)+'</div>';
  if((a.accessibility||[]).length){h+='<div class="badges" style="margin-top:8px">'+a.accessibility.map(function(x){return badge(x.replace(/_/g,' '),'green');}).join('')+'</div>';}
  h+='</div>';
  (a.prompts||[]).forEach(function(p){
    h+='<div class="panel"><div class="prompt"><div class="pc">'+esc(p.code)+' · '+esc(p.response_form.replace(/_/g,' '))+'</div><div class="stem">'+esc(p.stem)+'</div></div>';
    if((p.answers||[]).length||(p.feedback||[]).length){
      h+='<details class="reveal"><summary>'+((p.answers||[]).length?'Model answer &amp; feedback':'Guidance &amp; feedback')+'</summary><div class="body">';
      (p.answers||[]).forEach(function(ans){h+='<div class="model-answer">'+esc(ans)+'</div>';});
      (p.feedback||[]).forEach(function(f){h+='<div class="fb"><div class="ft">'+esc(f.feedback_type.replace(/_/g,' '))+'</div>'+esc(f.text)+'</div>';});
      h+='</div></details>';
    }
    h+='</div>';
  });
  if(a.rubric){
    h+='<div class="panel rubric"><h3>Assessment rubric</h3><table><thead><tr><th scope="col">Criterion</th><th scope="col">Levels</th></tr></thead><tbody>';
    (a.rubric.criteria||[]).forEach(function(cr){h+='<tr><td>'+esc(cr.descriptor)+'</td><td>'+(cr.levels||[]).map(esc).join(' · ')+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  return h;
}
function viewOutcomes(){
  var h=crumb([{label:'Modules',href:'#/'},{label:'Learning outcomes'}]);
  h+='<div class="page-head"><div class="kicker">Reference</div><h1>Learning outcomes</h1></div>';
  h+=noticeBlock();
  var byMod={};(DATA.outcomes||[]).forEach(function(o){(byMod[o.module]=byMod[o.module]||[]).push(o);});
  Object.keys(byMod).sort(function(a,b){return a-b;}).forEach(function(m){
    var ch=(DATA.chapters||[]).filter(function(c){return c.module==m;})[0];
    h+='<div class="panel"><h3>Module '+m+(ch?' — '+esc(ch.title):'')+'</h3><ul class="olist">';
    byMod[m].forEach(function(o){h+='<li><span class="oc">'+esc(o.id)+'</span><span>'+esc(o.statement)+' '+badge(o.type)+badge('band: '+o.provisional_band)+'</span></li>';});
    h+='</ul></div>';
  });
  return h;
}
function workflowTable(){
  var w=DATA.workflow; if(!w||!w.modules)return '';
  var rows=w.modules.map(function(m){return '<tr><td>Module '+m.module+'</td><td>'+stateBadge(m.state)+'</td><td>'+esc(m.approval_gate)+'</td></tr>';}).join('');
  return '<table class="wf"><thead><tr><th>Module</th><th>Lifecycle state</th><th>Approval gate</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p style="font-size:13px;color:var(--text-soft)">Human-approval gate (CP-02): <strong>'+esc(w.gate.status)+'</strong>. No module can reach <code>approved</code>/<code>published</code> while it is open.</p>';
}
function viewAbout(){
  var m=DATA.meta;
  var h=crumb([{label:'Modules',href:'#/'},{label:'About'}]);
  h+='<div class="page-head"><div class="kicker">About this build</div><h1>Provenance &amp; status</h1></div>';
  h+='<div class="panel prose">'+
    '<p>This offline course is a <strong>generated projection</strong> of the validated Hospitrainity curriculum package. Every module, section, activity and prompt on this site is rendered directly from the compiled canonical store — it is not hand-authored.</p>'+
    '<h3>Source &amp; version</h3>'+
    '<p>Source of truth: <code>'+esc(m.source_artifact)+'</code><br>Content version: <code>'+esc(m.content_version)+'</code><br>Lifecycle status: <code>'+esc(m.status)+'</code><br>Checkpoint: <code>'+esc(m.checkpoint)+'</code><br>Generated from: <code>'+esc(m.generated_from)+'</code></p>'+
    '<h3>Authoring &amp; approval status</h3>'+
    '<p>Unit of approval: <code>module</code>. Each module advances through the lifecycle <code>draft \u2192 review \u2192 approved \u2192 published</code>. Approval requires recorded human sign-offs (ESP/CEFR specialist, hospitality practitioner, accessibility reviewer) and closure of the CP-02 human-approval gate.</p>'+
    workflowTable()+
    '<h3>Quality assurance &amp; pilot readiness</h3>'+
    '<p>Every build passes an integrated quality-assurance harness that re-checks agreement across the whole pipeline \u2014 the id registry, the compiled canonical store, the rendered view-model, the render report, the approval ledgers and this rendered site \u2014 together with structural validation (schema, references, lifecycle, provenance), WCAG\u00a02.2\u00a0AA + UDL accessibility, editorial policy and a deterministic rebuild check.</p>'+
    '<p>Release policy: '+((DATA.workflow&&DATA.workflow.gate&&DATA.workflow.gate.status)==='closed'
      ? 'this build reflects a <strong>closed</strong> CP-02 human-approval gate, with all modules approved and published. Approval was recorded as a Project Owner final release verdict covering the three required review roles (ESP/CEFR specialist, hospitality practitioner, accessibility reviewer), rather than three independently-conducted specialist reviews \u2014 disclosed here for transparency.'
      : 'this build is prepared for <strong>internal-pilot review only</strong>. Public release is held until every module is approved by qualified human reviewers and the CP-02 human-approval gate is closed.')+' Gate status: <code>'+esc((DATA.workflow&&DATA.workflow.gate&&DATA.workflow.gate.status)||'open')+'</code>.</p>'+
    '<h3>Important limitation</h3><p>'+esc(m.disclaimer)+'</p>'+
    '</div>';
  return h;
}
function notFound(){return '<div class="page-head"><h1>Not found</h1></div><p class="empty">That page does not exist. <a href="#/">Return to modules</a>.</p>';}
function setNav(id){document.querySelectorAll('.nav-links a').forEach(function(a){if(a.getAttribute('data-nav')===id){a.setAttribute('aria-current','page');}else{a.removeAttribute('aria-current');}});}
function router(){
  var hash=location.hash.replace(/^#/,'')||'/';
  var parts=hash.split('/').filter(Boolean);
  var html,nav='';
  if(parts.length===0){html=viewHome();nav='home';}
  else if(parts[0]==='chapter'){html=viewChapter(decodeURIComponent(parts[1]||''));}
  else if(parts[0]==='activity'){html=viewActivity(decodeURIComponent(parts[1]||''));}
  else if(parts[0]==='outcomes'){html=viewOutcomes();nav='outcomes';}
  else if(parts[0]==='about'){html=viewAbout();nav='about';}
  else{html=notFound();}
  app.innerHTML=html;setNav(nav);
  app.focus();
  if(!(parts[0]==='activity')){window.scrollTo(0,0);}
}
foot.innerHTML='<div>'+esc(DATA.meta.product)+' · v'+esc(DATA.meta.content_version)+' · <a href="#/about">About &amp; sourcing</a></div>';
window.addEventListener('hashchange',router);
router();
</script>
</body>
</html>
