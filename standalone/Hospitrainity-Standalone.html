11-b13e-5511-b095-5cf2c59fafcf"],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"B. Never deflect, blame, or dismiss."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Q5. What are the three things to never do? A) listen, apologise, act B) deflect, blame, dismiss C) refund, upgrade, follow up","tokens":[]},{"accepted_normalized":[],"answers":["A"],"choices":[{"feedback":[{"feedback_type":"model_reveal","text":"A. Following up is what shows the guest you truly care."}],"id":"f5fc7bda-431b-59d3-b9a4-59ec3006ac98","label":"a","text":"to reassure the guest and confirm it is resolved"},{"feedback":[],"id":"dd5552bf-01e4-5d42-bad0-cac9b91398d2","label":"b","text":"to end the conversation quickly"},{"feedback":[],"id":"b55d7f47-b971-55a7-a176-1383df27c1d8","label":"c","text":"to charge the guest again"}],"code":"HSP-C07-QZ-Q6","correct_choice_ids":["f5fc7bda-431b-59d3-b9a4-59ec3006ac98"],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"A. Following up is what shows the guest you truly care."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Q6. What is the purpose of the follow-up step? A) to reassure the guest and confirm it is resolved B) to end the conversation quickly C) to charge the guest again","tokens":[]},{"accepted_normalized":[],"answers":["B"],"choices":[{"feedback":[],"id":"7f4dd72a-7cb4-5d1f-b2b8-c4aeb0a8a947","label":"a","text":"nothing, since it is not your fault"},{"feedback":[{"feedback_type":"model_reveal","text":"B. You can be sorry for the experience without assigning blame."}],"id":"2159ecd2-6815-59bf-bf69-9896280c3678","label":"b","text":"their poor experience, because it is about their feelings"},{"feedback":[],"id":"90c10bdb-4df5-5431-b362-2b559d766210","label":"c","text":"only if a manager tells you to"}],"code":"HSP-C07-QZ-Q7","correct_choice_ids":["2159ecd2-6815-59bf-bf69-9896280c3678"],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"B. You can be sorry for the experience without assigning blame."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Q7. A guest is angry and it is not your fault. What should you apologise for? A) nothing, since it is not your fault B) their poor experience, because it is about their feelings C) only if a manager tells you to","tokens":[]},{"accepted_normalized":[],"answers":["A"],"choices":[{"feedback":[{"feedback_type":"model_reveal","text":"A. It is the art of winning a guest back after something went wrong."}],"id":"972ebb3e-10ec-5546-aa9a-1cd2d3d0085a","label":"a","text":"turning an unhappy guest back into a happy one"},{"feedback":[],"id":"a6457fe8-693e-56f7-b547-61b2573c515a","label":"b","text":"repairing broken equipment"},{"feedback":[],"id":"8e171b87-1857-57b3-b5b0-005a66570578","label":"c","text":"recovering a lost booking"}],"code":"HSP-C07-QZ-Q8","correct_choice_ids":["972ebb3e-10ec-5546-aa9a-1cd2d3d0085a"],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"A. It is the art of winning a guest back after something went wrong."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Q8. What is “service recovery”? A) turning an unhappy guest back into a happy one B) repairing broken equipment C) recovering a lost booking","tokens":[]}],"response_form":"selection","rubric":null,"scoring_mode":"objective_choice","timing":"asynchronous","title":"Step 7. Quiz"},{"accessibility":["text_alt","keyboard_path","non_color_cue","no_timing_dependency","transcript"],"cefr_activity":"interaction","channel":"spoken_ftf","code":"HSP-C07-ACT-ROLEPLAY","completion_rule":"all_required_responses_and_self_checks_completed","guidance":null,"lesson_code":"HSP-C07-LS-09","outcome_codes":["OUT-M07-01","OUT-M07-02","OUT-M07-03"],"participation":"staff_guest","pedagogical_function":"freer_task","prompts":[{"accepted_normalized":[],"answers":[],"choices":[],"code":"HSP-C07-RP-FREE","correct_choice_ids":[],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"“I am very sorry to hear that, and I understand how frustrating it is to lose the Wi-Fi all day. This is the Listen and Apologise part. Let me send our technician to your room right away, and I will switch you to our backup network in the meantime. This is the Act part. As an apology, I would like to offer you a late check-out, and I will check back within the hour to make sure it is working. This is the Follow up part.”"}],"rating_scale":null,"response_constraints":{"audio_storage":"disabled","maximum_characters":6000,"minimum_non_whitespace_characters":1},"response_form":"role_play","scoring_mode":"model_self_check","self_check_required":true,"stem":"Prompt: A guest complains that the Wi-Fi has not worked all day. Handle it using the L-A-A-F framework.","tokens":[]},{"accepted_normalized":[],"answers":["b"],"choices":[{"feedback":[{"feedback_type":"error_specific","text":"(a) “Housekeeping usually does a good job.” This deflects instead of helping."}],"id":"53127cbd-6316-53e0-9b0c-e2ce16e39b10","label":"a","text":"“Housekeeping usually does a good job.”"},{"feedback":[{"feedback_type":"success","text":"(b) “I am so sorry, that is not our standard at all. I will have it cleaned immediately, or I can move you to another room right now. Which would you prefer?” This is the ideal answer, an apology, ownership, and a choice of solution."}],"id":"ba8f5d6d-7641-56d9-b12b-c3df6dd01636","label":"b","text":"“I am so sorry, that is not our standard at all. I will have it cleaned immediately, or I can move you to another room right now. Which would you prefer?”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) “Are you sure it is dirty?” This dismisses the guest and will only make it worse."}],"id":"ef356330-9eb0-5da4-acb5-99f16b0936ce","label":"c","text":"“Are you sure it is dirty?”"}],"code":"HSP-C07-RP-G1","correct_choice_ids":["ba8f5d6d-7641-56d9-b12b-c3df6dd01636"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “Housekeeping usually does a good job.” This deflects instead of helping."},{"feedback_type":"success","text":"(b) “I am so sorry, that is not our standard at all. I will have it cleaned immediately, or I can move you to another room right now. Which would you prefer?” This is the ideal answer, an apology, ownership, and a choice of solution."},{"feedback_type":"error_specific","text":"(c) “Are you sure it is dirty?” This dismisses the guest and will only make it worse."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Guest: “My room is dirty. This is unacceptable.”","tokens":[]},{"accepted_normalized":[],"answers":["b"],"choices":[{"feedback":[{"feedback_type":"error_specific","text":"(a) “That is the system’s fault, not mine.” This blames something else and helps no one."}],"id":"e70d80b3-1021-59c9-b709-a6f368988db0","label":"a","text":"“That is the system’s fault, not mine.”"},{"feedback":[{"feedback_type":"success","text":"(b) “I am very sorry for the error. Let me check your bill and correct it right away, and you will see the refund shortly.” This is the ideal answer, an apology, action, and reassurance."}],"id":"419d2589-77ab-570a-9ecf-50a909764c4f","label":"b","text":"“I am very sorry for the error. Let me check your bill and correct it right away, and you will see the refund shortly.”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) “You must have made a mistake.” This blames the guest, which is the fastest way to lose them."}],"id":"048a0c89-6ff5-5799-9939-8552cd164106","label":"c","text":"“You must have made a mistake.”"}],"code":"HSP-C07-RP-G2","correct_choice_ids":["419d2589-77ab-570a-9ecf-50a909764c4f"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “That is the system’s fault, not mine.” This blames something else and helps no one."},{"feedback_type":"success","text":"(b) “I am very sorry for the error. Let me check your bill and correct it right away, and you will see the refund shortly.” This is the ideal answer, an apology, action, and reassurance."},{"feedback_type":"error_specific","text":"(c) “You must have made a mistake.” This blames the guest, which is the fastest way to lose them."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Guest: “You charged me twice.”","tokens":[]},{"accepted_normalized":[],"answers":["b"],"choices":[{"feedback":[{"feedback_type":"error_specific","text":"(a) “Well, nobody is perfect.” Dismissive and cold."}],"id":"6cad5c5e-6251-5df1-a1f8-99b4ee145443","label":"a","text":"“Well, nobody is perfect.”"},{"feedback":[{"feedback_type":"success","text":"(b) “I am truly sorry, and I understand why you are frustrated after a second issue. Let me put this right now, and I will speak with my manager to make sure it does not happen again.” This is the ideal answer, empathy, action, and a follow-up promise."}],"id":"74656c58-6758-51c0-b0df-1b8287e59472","label":"b","text":"“I am truly sorry, and I understand why you are frustrated after a second issue. Let me put this right now, and I will speak with my manager to make sure it does not happen again.”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) “There is nothing I can do.” This gives up on the guest entirely."}],"id":"85d747ce-08e3-56b1-8bd6-25bebd0ea65d","label":"c","text":"“There is nothing I can do.”"}],"code":"HSP-C07-RP-G3","correct_choice_ids":["74656c58-6758-51c0-b0df-1b8287e59472"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “Well, nobody is perfect.” Dismissive and cold."},{"feedback_type":"success","text":"(b) “I am truly sorry, and I understand why you are frustrated after a second issue. Let me put this right now, and I will speak with my manager to make sure it does not happen again.” This is the ideal answer, empathy, action, and a follow-up promise."},{"feedback_type":"error_specific","text":"(c) “There is nothing I can do.” This gives up on the guest entirely."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Guest: “This is the second time I have had a problem here.”","tokens":[]}],"response_form":"mixed","rubric":{"code":"HSP-C07-RP-RUBRIC","criteria":[{"code":"HSP-C07-RP-RUBRIC-WARMTH","descriptor":"Warm, professional welcome and tone","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C07-RP-RUBRIC-SOLUTION","descriptor":"Offers help and moves toward a concrete solution","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C07-RP-RUBRIC-POLITENESS","descriptor":"Polite, softened language (e.g. \"Could I ... please\")","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C07-RP-RUBRIC-PROGRESSION","descriptor":"Calmly moves the interaction to the next step","levels":["Not yet","Developing","Strong"]}]},"scoring_mode":"mixed","timing":"synchronous","title":"Step 6. Role-play"}],"code":"HSP-C07","module":7,"outcome_codes":["OUT-M07-01","OUT-M07-02","OUT-M07-03"],"sections":[{"blocks":[{"id":"3d9eb5f5-3da2-594a-a6c3-b8296226ef95","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answer these quietly for yourself first. There are no right or wrong answers, just a gentle way to warm up.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":820,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Warm-Up"],"normalized_text_sha256":"dc2b3712b572545e3ee93b53f0dda46eebf01fe5ccce877e4813773942162d9c"},"text":"Answer these quietly for yourself first. There are no right or wrong answers, just a gentle way to warm up.","type":"instruction"},{"id":"c4057005-6c5c-5cd3-846e-123c501932e4","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In one word, how do you feel when someone is upset with you?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":821,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Warm-Up"],"normalized_text_sha256":"394023919b4a4b6c09bab0fa496083a8d3620011857cf9a06debcec08a5f8158"},"text":"In one word, how do you feel when someone is upset with you?","type":"list_item"},{"id":"6c9030b4-49c4-59d2-a821-9a302504fa58","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Think of a time you complained about a service. What did you most want to hear?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":822,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Warm-Up"],"normalized_text_sha256":"b01c22cf90a4c62a55598fe1ee32da526f07bffc65df8d686f0b92c3b0b9218b"},"text":"Think of a time you complained about a service. What did you most want to hear?","type":"list_item"},{"id":"8e472f40-1775-5308-b441-f55892f78584","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In your own language, how do you ","underline":false},{"bold":false,"italic":false,"text":"apologise","underline":false},{"bold":false,"italic":false,"text":" so that it sounds genuine?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":823,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Warm-Up"],"normalized_text_sha256":"57e9d513006d90e241cefa3b538586cbdbc6a716e72b93cc04f103ad746903c6"},"text":"In your own language, how do you apologise so that it sounds genuine?","type":"list_item"}],"code":"HSP-C07-LS-01","order":1,"title":"Warm-Up"},{"blocks":[{"id":"65f287d8-1da1-5ce4-a36d-b3a21f65a576","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Here is a truth that surprises many people. A guest who complains is often giving you a gift, because they are telling you what is wrong instead of quietly leaving and posting a bad review. How you respond in that moment can either lose them for good or win them for years. Service professionals call this service recovery, and studies show that a complaint handled well can leave a guest more loyal than they were before the problem happened.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":825,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Why this matters"],"normalized_text_sha256":"6540a366804deeffe1086d23eb743025b30175e5ad99c0a70b9cd52a11bdc2cc"},"text":"Here is a truth that surprises many people. A guest who complains is often giving you a gift, because they are telling you what is wrong instead of quietly leaving and posting a bad review. How you respond in that moment can either lose them for good or win them for years. Service professionals call this service recovery, and studies show that a complaint handled well can leave a guest more loyal than they were before the problem happened.","type":"paragraph"},{"id":"9a3ea861-ee05-5342-a4e4-ec9ef8b53d8f","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Good to know: the framework in this chapter lines up with well-known industry models such as LAST, which stands for Listen, ","underline":false},{"bold":false,"italic":false,"text":"Apologise","underline":false},{"bold":false,"italic":false,"text":", Solve, and Thank, and HEAT, which stands for Hear, ","underline":false},{"bold":false,"italic":false,"text":"Empathise","underline":false},{"bold":false,"italic":false,"text":", ","underline":false},{"bold":false,"italic":false,"text":"Apologise","underline":false},{"bold":false,"italic":false,"text":", and Take action. This is a real, professional approach. See the further reading at the end of this chapter.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":826,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Why this matters"],"normalized_text_sha256":"6ac17ceb651f4b3ce2137139960807fde36b1b8d527e30282f7aaf1406d91311"},"text":"Good to know: the framework in this chapter lines up with well-known industry models such as LAST, which stands for Listen, Apologise, Solve, and Thank, and HEAT, which stands for Hear, Empathise, Apologise, and Take action. This is a real, professional approach. See the further reading at the end of this chapter.","type":"paragraph"}],"code":"HSP-C07-LS-02","order":2,"title":"Why this matters"},{"blocks":[{"id":"61ebfc87-c7b3-5400-af55-9628fcc5bbe1","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A guest at the Grand Serenata Hotel is upset.","underline":false},{"bold":false,"italic":false,"text":" Perhaps the room was noisy, or it was not clean, or there was a mistake on the bill. Complaints are emotional and they happen in stages, so you need to manage your own tone, follow a clear framework, and turn a bad moment into a recovered guest. In this chapter you will ","underline":false},{"bold":false,"italic":false,"text":"practise","underline":false},{"bold":false,"italic":false,"text":" both a face-to-face conversation and a written letter of apology.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":829,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"f1f57a26cf1880d957b3dc4bf294c01a7d110845e7414165ba9d279e87b679bb"},"text":"A guest at the Grand Serenata Hotel is upset. Perhaps the room was noisy, or it was not clean, or there was a mistake on the bill. Complaints are emotional and they happen in stages, so you need to manage your own tone, follow a clear framework, and turn a bad moment into a recovered guest. In this chapter you will practise both a face-to-face conversation and a written letter of apology.","type":"paragraph"},{"id":"51cbdf30-b7d9-5bfc-ba06-0884d972d0d5","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"The L-A-A-F complaint framework, your reliable four steps:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":830,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"e20560006bd49d464abfa89caf3d5854d69f9585d99798fbd7dabc578f7caddf"},"text":"The L-A-A-F complaint framework, your reliable four steps:","type":"heading"},{"id":"34da9c50-2b30-5a53-8a12-c59b2ba11ae6","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Listen.","underline":false},{"bold":false,"italic":false,"text":" Let the guest speak fully. Do not interrupt, and do not defend.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":831,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"238dacf626952eecf5306c2143898cf1532af39486d01b0863ed1e4983953dc8"},"text":"Listen. Let the guest speak fully. Do not interrupt, and do not defend.","type":"list_item"},{"id":"91e88a05-a3cf-5af3-9eba-4a32543c6bc9","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Apologise","underline":false},{"bold":true,"italic":false,"text":" and ","underline":false},{"bold":true,"italic":false,"text":"empathise","underline":false},{"bold":true,"italic":false,"text":".","underline":false},{"bold":false,"italic":false,"text":" Offer a sincere apology, and show that you understand how they feel.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":832,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"0767a9d48bdc54565251dc88fc4f4329e863370370e4985de6d5e498f5545c63"},"text":"Apologise and empathise. Offer a sincere apology, and show that you understand how they feel.","type":"list_item"},{"id":"e52834c8-4144-59a9-9169-a4c626a38e66","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Act.","underline":false},{"bold":false,"italic":false,"text":" Take ownership and offer a concrete solution right now.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":833,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"8cb20e25863db327a0c2aa53bef1ef77b19dac273a99d53ada78825b1789300f"},"text":"Act. Take ownership and offer a concrete solution right now.","type":"list_item"},{"id":"ff05e788-c7e9-52be-a017-3e63aa309c10","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Follow up.","underline":false},{"bold":false,"italic":false,"text":" Reassure the guest, and check back to be sure it is truly resolved.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":834,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"87883f1d88e84f26ee67a96293ea856e201ed3aa0cda210a0dac40a5cde836b9"},"text":"Follow up. Reassure the guest, and check back to be sure it is truly resolved.","type":"list_item"},{"id":"c30949a5-52b0-5cb5-b2d7-46e88b03d481","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"And the three things to never do: do not deflect, do not blame, and do not dismiss.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":835,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 1. The scenario and the framework"],"normalized_text_sha256":"c250d58b696ea3795e20c67702f1bf2a565065828189a2dbdb28765aff43e993"},"text":"And the three things to never do: do not deflect, do not blame, and do not dismiss.","type":"paragraph"}],"code":"HSP-C07-LS-03","order":3,"title":"Step 1. The scenario and the framework"},{"blocks":[{"id":"d1e78bb6-c98e-5339-bc65-6c5130a5cf38","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Read each example out loud once. Saying it is the quickest way to remember it.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":838,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 2. Key vocabulary"],"normalized_text_sha256":"76c076b1536696db6aa24f33d35148977e5cdfeb40d8235284f37957bc7e5f78"},"text":"Read each example out loud once. Saying it is the quickest way to remember it.","type":"instruction"},{"caption":"Step 2. Key vocabulary: Word or phrase / What it means / How you might say it","header":["Word or phrase","What it means","How you might say it"],"id":"a31720c1-67ff-5d55-911e-d9285011b908","language":"en","order":2,"provenance_kind":"source_verbatim","rows":[["complaint","an expression of dissatisfaction","“I would like to make a complaint.”"],["to apologise","to say sorry sincerely","“I sincerely apologise for this.”"],["inconvenience","trouble or difficulty caused","“I am sorry for the inconvenience.”"],["to take ownership","to accept responsibility yourself","“Let me take care of this for you.”"],["to resolve","to fix a problem","“We will resolve this right away.”"],["refund","money returned to the guest","“We will arrange a full refund.”"],["goodwill gesture","a kind extra to make up for a problem","“As a goodwill gesture, breakfast is on us.”"],["to reassure","to help someone feel confident again","“Let me reassure you that this is now fixed.”"],["service recovery","turning an unhappy guest back into a happy one","“Good service recovery builds loyalty.”"],["to follow up","to check back a little later","“I will follow up with you this evening.”"],["to escalate","to bring in a manager for help","“I will escalate this to my manager.”"],["empathy","showing you understand how they feel","“That sounds really frustrating.”"]],"source_locator":{"artifact":"Hospitrainity.docx","body_index":839,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 2. Key vocabulary"],"normalized_text_sha256":"ffad8e15f7af7c6befcfece5b28a870211f2ae5e78f656210fdf765dc557447a"},"type":"source_table"},{"id":"e8642834-4940-59b4-81d4-c2766ea325ca","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"The most powerful words in this whole chapter are simple ones: “I understand,” “I am sorry,” and “let me fix this.” Said with genuine care, they calm almost any situation.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":840,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 2. Key vocabulary"],"normalized_text_sha256":"a991d74b20b589aef46bfab554a5394877152d1741358206164c11705ffbc6df"},"text":"The most powerful words in this whole chapter are simple ones: “I understand,” “I am sorry,” and “let me fix this.” Said with genuine care, they calm almost any situation.","type":"paragraph"}],"code":"HSP-C07-LS-04","order":4,"title":"Step 2. Key vocabulary"},{"blocks":[{"id":"2192052e-b69a-555c-b20d-bd8af5ba3781","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Listen and acknowledge","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":843,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"e031da16478a852167dfbdbd95fde039bd530a26ba7a4249471baa1796e55ced"},"text":"Listen and acknowledge","type":"heading"},{"id":"f0476f2c-ad97-5c0b-8e1a-8aabf81bf920","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“I understand, and I am very sorry to hear about this.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":844,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"1f0cb546dfb5f6bb06c7096e99b625ebaf448b66519d1950b3ca168aea8d2d13"},"text":"“I understand, and I am very sorry to hear about this.”","type":"list_item"},{"id":"e47ee11d-273e-5a63-b74f-cda532722c2a","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Apologise","underline":false},{"bold":true,"italic":false,"text":" and ","underline":false},{"bold":true,"italic":false,"text":"empathise","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":845,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"0d87045b836a3a1c0a40ab14a7e8bc823e1e2961705f8b685aafc77ee8179a18"},"text":"Apologise and empathise","type":"heading"},{"id":"04756180-e1cd-5e50-b411-8e51c271d113","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“I sincerely ","underline":false},{"bold":false,"italic":false,"text":"apologise","underline":false},{"bold":false,"italic":false,"text":" for the inconvenience. That must have been very frustrating.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":846,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"ad4db06baaa8e77742a261e24bcdbc651c6cea84a462d0d149255ecfc2886455"},"text":"“I sincerely apologise for the inconvenience. That must have been very frustrating.”","type":"list_item"},{"id":"d0ede98e-ebdf-573f-9f32-7875566e23a5","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Act, take ownership, and offer a solution","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":847,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"cc193268d8e68a812f74c89b500a9b9a1d6804fb941e8be21e71474dfc746ec6"},"text":"Act, take ownership, and offer a solution","type":"heading"},{"id":"0e1e35e8-e1c4-5599-90a2-7caada50ace3","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Let me fix this for you right away. I will move you to another room immediately.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":848,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"dd20b134a53085e935616a8b64c0105ba01dcb8677f09438c3801c7a9bf9c5a7"},"text":"“Let me fix this for you right away. I will move you to another room immediately.”","type":"list_item"},{"id":"c9a76e9c-f740-5f14-ac94-6926fc9562c1","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Offer a goodwill gesture","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":849,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"46ba4d0649ca01f5fa5874ee53cbd2fa11fb56246bc9b955494e042adf5ea956"},"text":"Offer a goodwill gesture","type":"heading"},{"id":"048a520f-1a4a-5964-b2f2-34c93d722b57","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“As an apology, we would like to offer you a complimentary breakfast.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":850,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"375e7d1c2b6c0686034b6f4891543b5277e7ae918013b5650e4208e44a0e634b"},"text":"“As an apology, we would like to offer you a complimentary breakfast.”","type":"list_item"},{"id":"e351ddfd-bdd2-5c67-938d-e59e1b06dd7e","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Follow up and reassure","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":851,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"edd2bb2c1b8e635b81c04376413e72e64d991ce7459c4334b8d7c3d837bc462f"},"text":"Follow up and reassure","type":"heading"},{"id":"d072485a-c5bf-53ab-9e37-293d6388c7ba","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“I will personally check later to make sure everything is now to your satisfaction.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":852,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"7471ad447cb3e2055ccc898743d23fb3950fe7ea18c7e0c9cc53e065cc5ce299"},"text":"“I will personally check later to make sure everything is now to your satisfaction.”","type":"list_item"},{"id":"8bfdd314-ff0b-57ec-8785-6e6bae2996b5","language":"en","order":11,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Staying calm when the guest is not","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":854,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"301389986d74d908d331fdd7674c91c16eb88d500fc428e5ecea2fceede02fb6"},"text":"Staying calm when the guest is not","type":"heading"},{"id":"2bbb3094-cda2-5143-b9e6-6a3639b7e922","language":"en","order":12,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"This is the emotional heart of the job, so give yourself a few anchors:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":855,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"035e94498ef6346fbb83e7f137e7c5709dd044d4627b74714b0319163eab1dfc"},"text":"This is the emotional heart of the job, so give yourself a few anchors:","type":"paragraph"},{"id":"0f90befa-26da-5b3d-bfeb-e9517e278223","language":"en","order":13,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Take a breath and let the guest finish. People calm down when they feel heard.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":856,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"90e60a96c2a29fa8084e959183672c10c03a84f581b24f8f5c4c92c688ff43b6"},"text":"Take a breath and let the guest finish. People calm down when they feel heard.","type":"list_item"},{"id":"bb56fad9-39dc-5a6d-b511-5fe614b6407e","language":"en","order":14,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Never take the anger personally. They are upset with the situation, not with you.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":857,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"228a83cfaf6d70c6e80bb01ae3b79d8be846488c41c751b34a31d5fa2f4ff20b"},"text":"Never take the anger personally. They are upset with the situation, not with you.","type":"list_item"},{"id":"1d9028aa-a30f-5b92-b1d2-cbd300ea657d","language":"en","order":15,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Say sorry for the experience even when it was not your fault. It is about their feelings, not about blame.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":858,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"9d93e59b084b8fea260ecc4f5f9094c1f81e9e59431e76e033cd3e2d9bdbb578"},"text":"Say sorry for the experience even when it was not your fault. It is about their feelings, not about blame.","type":"list_item"},{"id":"0a8ae1a2-03d0-55f9-800e-57ccc5d14d41","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Slow down. A calm, steady voice quietly invites the guest to calm down too.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":859,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 3. Useful phrases, mapped to the framework"],"normalized_text_sha256":"7e134776761fb547b9f80b4b01d9475c125a87591d2b75523ab4d4bb60959c66"},"text":"Slow down. A calm, steady voice quietly invites the guest to calm down too.","type":"list_item"}],"code":"HSP-C07-LS-05","order":5,"title":"Step 3. Useful phrases, mapped to the framework"},{"blocks":[{"id":"ca4dea2d-a660-501e-8802-56f90cf3ba1a","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"R","underline":false},{"bold":false,"italic":false,"text":" stands for Receptionist, and ","underline":false},{"bold":true,"italic":false,"text":"G","underline":false},{"bold":false,"italic":false,"text":" stands for Guest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":862,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"cfc3517fb473908e51fa64decf51b5f6403086e4a4252590158ba7a31ac99b1e"},"text":"R stands for Receptionist, and G stands for Guest.","type":"paragraph"},{"id":"a12ef0f9-2cdf-557d-aac5-2a86bfb5984b","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" I could not sleep at all. The room next door was so noisy.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" I understand, and I am very sorry to hear about this. That must have been very frustrating.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" It was terrible.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" I sincerely ","underline":false},{"bold":false,"italic":false,"text":"apologise","underline":false},{"bold":false,"italic":false,"text":" for the inconvenience. Let me fix this for you right away. I will move you to a quieter room on a higher floor immediately.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Okay, thank you.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" As an apology, we would also like to offer you a complimentary breakfast. I will personally check later to make sure everything is now to your satisfaction.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" I really appreciate that.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Thank you for your patience, and again, my sincere apologies.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":863,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"508969ff6f99a2dd17fd053041940ce3e97b618b296ec04b4d179bfb8266fefd"},"text":"G: I could not sleep at all. The room next door was so noisy.\nR: I understand, and I am very sorry to hear about this. That must have been very frustrating.\nG: It was terrible.\nR: I sincerely apologise for the inconvenience. Let me fix this for you right away. I will move you to a quieter room on a higher floor immediately.\nG: Okay, thank you.\nR: As an apology, we would also like to offer you a complimentary breakfast. I will personally check later to make sure everything is now to your satisfaction.\nG: I really appreciate that.\nR: Thank you for your patience, and again, my sincere apologies.","type":"paragraph"},{"id":"b1dd28db-d4a6-501d-a85e-adb2a1aa79b4","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Notice the four beats of the framework in action: the receptionist listened, ","underline":false},{"bold":false,"italic":false,"text":"apologised","underline":false},{"bold":false,"italic":false,"text":" with empathy, acted with a real solution, and promised to follow up. Not one word was spent defending or blaming, and that is exactly why it works.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":864,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"4e13d74540ee57fc384b614dcc9146f6ad87d9ddc2299df6d02bad90fd196986"},"text":"Notice the four beats of the framework in action: the receptionist listened, apologised with empathy, acted with a real solution, and promised to follow up. Not one word was spent defending or blaming, and that is exactly why it works.","type":"paragraph"},{"id":"d2e4ba87-f1cb-514d-84a0-b45855d12754","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A model letter of apology:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":865,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"3a86a485d7c732b4e86f210d4857dedb98270b1c3dd925f0621ef7a8612f95dd"},"text":"A model letter of apology:","type":"heading"},{"id":"f4238a5e-0599-532e-9d97-c2a00dcf2e0a","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Dear Mr. Chen,","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":866,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"a66790c14de0e4408c0044151561a6f93856f88ca21033b1478246225f073f06"},"text":"Dear Mr. Chen,","type":"heading"},{"id":"06cecb2d-d319-5e99-8558-c11f4bec12e8","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Thank you for taking the time to share your feedback. Please accept our sincere apologies for the noise during your stay, as we understand how important a restful night is.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":867,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"7913765843e14a29508bc0e90d14745b29fc4bd3da2488a1f11dde616ccf009b"},"text":"Thank you for taking the time to share your feedback. Please accept our sincere apologies for the noise during your stay, as we understand how important a restful night is.","type":"paragraph"},{"id":"2ac8a33a-e84a-5d67-81b3-7597fa865521","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"We have raised the issue with our team so that we can prevent it from happening again. As a gesture of goodwill, we would be glad to offer you a complimentary night on your next visit.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":868,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"86ccf167ba1b8b65f093c53a449329272e3e16d122263f9f6513697036afcb36"},"text":"We have raised the issue with our team so that we can prevent it from happening again. As a gesture of goodwill, we would be glad to offer you a complimentary night on your next visit.","type":"paragraph"},{"id":"6c499137-0334-5840-b7aa-d28843695e52","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"We truly hope to have the chance to welcome you back and give you the stay you deserve.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":869,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 4. Model dialogue and letter"],"normalized_text_sha256":"eefc217573621aa60be7a3039e174ca55ffad5cc8a4cf1b70fc67918617fa174"},"text":"We truly hope to have the chance to welcome you back and give you the stay you deserve.","type":"paragraph"},{"id":"07f50c11-2318-5ca5-9092-0c084c81c4f5","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Kind regards,","underline":false}],"source_lo et the guest finish first, always.","type":"list_item"},{"id":"8302ac3f-bfcb-5698-96c8-9ce1260c03f8","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Saying “that is not my fault.” Even when true, it sounds like you do not care.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":876,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Common mistakes to avoid"],"normalized_text_sha256":"eec3a5eff612ce14636933aec78ade5c672e79fa5cbd83249c78a6704bda0b6e"},"text":"Saying “that is not my fault.” Even when true, it sounds like you do not care.","type":"list_item"},{"id":"6b07125c-5f74-5c42-920f-38b442856a23","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Apologising","underline":false},{"bold":false,"italic":false,"text":" but doing nothing. An apology without action feels empty.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":877,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Common mistakes to avoid"],"normalized_text_sha256":"d91de2221cfeafac9691fd6fbea296423f1383616961969c5ae619f43e8ca74c"},"text":"Apologising but doing nothing. An apology without action feels empty.","type":"list_item"},{"id":"653a9b60-fbcf-5b39-8296-aed7355bbd58","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Over-promising to calm the moment. Only offer what you can truly deliver.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":878,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Common mistakes to avoid"],"normalized_text_sha256":"abe633f548ab339a583980373fe00c5b12a0cac33e9760bcccd239145396f2ea"},"text":"Over-promising to calm the moment. Only offer what you can truly deliver.","type":"list_item"},{"id":"c0672095-bbd3-52d3-8991-1fd7cfe74062","language":"en","order": e it cleaned immediately, or I can move you to another room right now. Which would you prefer?” This is the ideal answer, an apology, ownership, and a choice of solution.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":901,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"5b4af9c30d88e6ed4037cf0a43b2a4bc17cee6d5bde2e601ec337f1998e43ff3"},"text":"(b) “I am so sorry, that is not our standard at all. I will have it cleaned immediately, or I can move you to another room right now. Which would you prefer?” This is the ideal answer, an apology, ownership, and a choice of solution.","type":"paragraph"},{"id":"e7595192-0b1c-5925-a4b5-43a4b123a4fe","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “Are you sure it is dirty?” This dismisses the guest and will only make it worse.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":902,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"7b5a0cd63c146b9b5ebe5dc1f48569c07e652edfa819ef9829370420b620ea7a"},"text":"(c) “Are you sure it is dirty?” This dismisses the guest and will only make it worse.","type":"paragraph"},{"id":"e83898ab-eef8-51b2-b67f-bf0508a4e82e","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “You charged me twice.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":903,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"863d89a683c03d6cc2176996a6fd11644f6ab9bebc897f6ecc8cc08f4757c46f"},"speaker":"Guest","text":"“You charged me twice.”","type":"dialogue_turn"},{"id":"a86f479b-ef79-5006-bc97-6580c1bd2cd7","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":904,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"01d0491f-2f8e-5b8e-a007-301acd0ae752","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “That is the system’s fault, not mine.” This blames something else and helps no one.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":905,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"cd5a143df2b2bb205544013d35a17aae1dbb1fa6889abe5e301ddf1f8b60e1de"},"text":"(a) “That is the system’s fault, not mine.” This blames something else and helps no one.","type":"paragraph"},{"id":"c7ec34fc-8f26-577e-847f-c3885acde1d3","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “I am very sorry for the error. Let me check your bill and correct it right away, and you will see the refund shortly.” This is the ideal answer, an apology, action, and reassurance.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":906,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"74c4fc52b38b2f5e5fd8f34d6967f2f3804f0f4c277fa31c36c902689372ee78"},"text":"(b) “I am very sorry for the error. Let me check your bill and correct it right away, and you will see the refund shortly.” This is the ideal answer, an apology, action, and reassurance.","type":"paragraph"},{"id":"c225138a-a109-521b-9827-a98e763e3e85","language":"en","order":11,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “You must have made a mistake.” This blames the guest, which is the fastest way to lose them.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":907,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"2b182196126c17bd81a3a6d2e94ceb5ece06c6b917d9bafce551582e6de842d9"},"text":"(c) “You must have made a mistake.” This blames the guest, which is the fastest way to lose them.","type":"paragraph"},{"id":"be89c225-0cfa-5da5-8dbd-160f55eedb35","language":"en","order":12,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “This is the second time I have had a problem here.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":908,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"7f6de5bbaa2143571ef26a809e84350898c6e3639493956ffce54e8baf6947a2"},"speaker":"Guest","text":"“This is the second time I have had a problem here.”","type":"dialogue_turn"},{"id":"8dac6662-1a09-5272-a101-acce7172c242","language":"en","order":13,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":909,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"d2834f32-6e9c-5cae-b7e1-79ad5e1bca7c","language":"en","order":14,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “Well, nobody is perfect.” Dismissive and cold.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":910,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"53e0ab7a0380f68521110ec30fdf6a811f5bb1b69cf390414e0cab630e4b04ee"},"text":"(a) “Well, nobody is perfect.” Dismissive and cold.","type":"paragraph"},{"id":"9ba14551-200a-53d2-b016-df4fb57c9af1","language":"en","order":15,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “I am truly sorry, and I understand why you are frustrated after a second issue. Let me put this right now, and I will speak with my manager to make sure it does not happen again.” This is the ideal answer, empathy, action, and a follow-up promise.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":911,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"e17707be07577fee405fd86c5cfdd228285ecffabf45fd681ec9c4f965d4c778"},"text":"(b) “I am truly sorry, and I understand why you are frustrated after a second issue. Let me put this right now, and I will speak with my manager to make sure it does not happen again.” This is the ideal answer, empathy, action, and a follow-up promise.","type":"paragraph"},{"id":"01c6315d-5bb4-5330-9434-943f1cf13336","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “There is nothing I can do.” This gives up on the guest entirely.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":912,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"8188fd25734ded3ec8d1e264be9f04402de5c79c82a61c68a75ac74ae3700c4a"},"text":"(c) “There is nothing I can do.” This gives up on the guest entirely.","type":"paragraph"},{"id":"bb6055ff-e3a5-553d-b434-1f5ed0f39ee1","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Free mode (your turn, speak or write your own answer)","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":913,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"6c342355148bccd8a90347b4d0badde4e3d86baba374a58aa359fd82c001d9bb"},"text":"Free mode (your turn, speak or write your own answer)","type":"heading"},{"id":"d24071d0-3bde-53ef-9be2-7590f1160426","language":"en","order":18,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Prompt:","underline":false},{"bold":false,"italic":false,"text":" A guest complains that the Wi-Fi has not worked all day. Handle it using the L-A-A-F framework.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":914,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"3576356757a4010a6cc671137d2a2d591575aef4f54d6d2df89c5867dc77016b"},"text":"Prompt: A guest complains that the Wi-Fi has not worked all day. Handle it using the L-A-A-F framework.","type":"instruction"},{"id":"7ee460d0-0384-52d3-be86-a7eddac7ea4d","language":"en","order":19,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"See a model answer","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":915,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"115cd5fb848ceef36134cf981997fcf0d145aca19ef299453b13791da2b2b176"},"text":"See a model answer","type":"paragraph"},{"id":"fc4d8fdc-5457-5a05-92df-2acd57fe7a28","language":"en","order":20,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“I am very sorry to hear that, and I understand how frustrating it is to lose the Wi-Fi all day. This is the Listen and ","underline":false},{"bold":false,"italic":false,"text":"Apologise","underline":false},{"bold":false,"italic":false,"text":" part. Let me send our technician to your room right away, and I will switch you to our backup network in the meantime. This is the Act part. As an apology, I would like to offer you a late check-out, and I will check back within the hour to make sure it is working. This is the Follow up part.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":916,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"c9e0d82d410a4ca305021672bb23e289ed53eb9a707e3f6b0e91ea0d5586e7bc"},"text":"“I am very sorry to hear that, and I understand how frustrating it is to lose the Wi-Fi all day. This is the Listen and Apologise part. Let me send our technician to your room right away, and I will switch you to our backup network in the meantime. This is the Act part. As an apology, I would like to offer you a late check-out, and I will check back within the hour to make sure it is working. This is the Follow up part.”","type":"paragraph"},{"activity_code":"HSP-C07-ACT-ROLEPLAY","id":"6ef0e985-ca9a-5baa-b97d-480e46142845","language":"en","order":21,"provenance_kind":"derived_navigation","source_locator":{"artifact":"Hospitrainity.docx","body_index":896,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 6. Role-play"],"normalized_text_sha256":"2820d9182be9f0c2b25264c9853f2df9c8c0866110449f03bf85a3cd5e08c862"},"type":"activity_embed"}],"code":"HSP-C07-LS-09","order":9,"title":"Step 6. Role-play"},{"blocks":[{"id":"04039396-029b-53ec-9446-64f13b233468","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Q1.","underline":false},{"bold":false,"italic":false,"text":" What is the first step when a guest complains? A) defend the hotel B) listen C) offer a discount straight away","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":919,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 7. Quiz"],"normalized_text_sha256":"5b325fcd3aada09934  are rules.” B) “I sincerely apologise for the inconvenience.” C) “Calm down.”","type":"paragraph"},{"id":"96e29119-75a5-511c-83f4-14be8b94daf8","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answer","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":923,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 7. Quiz"],"normalized_text_sha256":"b2a3aa602762a782e47a4f8e93bb5ae1b8819d1b92b7e6ceb3ef46a3c7077eb0"},"text":"Answer","type":"instruction"},{"id":"8044f7a1-832b-587f-a500-62db890a38cf","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"B.","underline":false},{"bold":false,"italic":false,"text":" It is sincere and specific.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":924,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 7. Quiz"],"normalized_text_sha256":"53414730c733988030dec11ca6f7e298d95d34332c9c4b06775de7e07930e60d"},"text":"B. It is sincere and specific.","type":"paragraph"},{"id":"24eedcd2-ef99-57da-8b9b-8bdff4bebe04","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Q3.","underline":false},{"bold":false,"italic":false,"text":" “Taking ownership” means ... A) blaming the system B) accepting responsibility and acting C) sending the guest away","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":925,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Step 7. Quiz"],"normalized_text_sha256":"9fd68178d24fea0497d7f5155935ae2e9540569e8cca11c36e95dda87eabc126"},"text":"Q3. “Taking ownership” means ... A) blaming the system B) accepting responsibility and acting C) sending the guest away","type":"paragraph"},{"id":"89f9b4f0-4eba-53f7-95d5-3ba61a2a436e","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"ita  by writing a short letter of apology for it. If you can handle your hardest imagined case on paper, the real ones will feel far more manageable.","type":"paragraph"},{"id":"c39d5b83-c937-5b13-ba52-5831ac3ab7b0","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"The letter of apology in detail","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":951,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Take it further"],"normalized_text_sha256":"d316d8650ada7c5f6939aae5bffadfd78cff2db00cb0b1b22c12034a97c32dbe"},"text":"The letter of apology in detail","type":"heading"},{"id":"2a9a1439-a477-5b95-b59a-86bca04e07cc","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Handling complaints well means hearing the guest out fully, ","underline":false},{"bold":false,"italic":false,"text":"apologising","underline":false},{"bold":false,"italic":false,"text":" sincerely, putting things right, and holding on to positive language even when the pressure is high. A letter of apology follows a clear structure, and the model letter above already uses it:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":952,"chapter":7,"heading_path":["Dealing with Problems and Complaints","Take it further"],"normalized_text_sha256":"986d3968e85651083562aa64dfbb438d204567136108b750d5534f9c4fe850e7"},"text":"Handling complaints well means hearing the guest out fully, apologising sincerely, putting things right, and holding on to positive language even when the pressure is high. A letter of apology follows a clear structure, and the model letter above already uses it:","type":"paragraph"},{"id":"61edf0a1-5b1d-5da7-9d47-fb8d5f4a147b","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Thank the guest for taking the time to write.","underline":false}],"source_locat
