ns making the guest feel welcome, understood, and helped. In a hotel, your English matters a great deal, and so does your attitude. Three things make service feel great:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":48,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"02987485df17034d3026df04dba6344029b6825acec4e116eb62e59a290cd73c"},"text":"Customer care means making the guest feel welcome, understood, and helped. In a hotel, your English matters a great deal, and so does your attitude. Three things make service feel great:","type":"paragraph"},{"id":"55f3f935-7af3-5ba3-a54d-b28936ffd5d2","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Warmth","underline":false},{"bold":false,"italic":false,"text":", which is a genuine greeting and a friendly tone.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":49,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"72d33f4adf4c59d3879c5570d985b96b6bb8766fbc46fb48e25992d882e92948"},"text":"Warmth, which is a genuine greeting and a friendly tone.","type":"list_item"},{"id":"829b5c3d-bd45-5e76-9ea6-6ffeef399440","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Attentiveness","underline":false},{"bold":false,"italic":false,"text":", which is truly listening to what the guest needs.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":50,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"53059172d13401acbccc1db6b62d902a24f4ad4030aa9bf98d839d365f9736e1"},"text":"Attentiveness, which is truly listening to what the guest needs.","type":"list_item"},{"id":"027e3c9b-551a-5ddb-9fb2-edc342ff9108","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Problem-solving","underline":false},{"bold":false,"italic":false,"text":", which is calmly putting things right when they go wrong.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":51,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"5caf2d66f896b10a042bc0f0d09f96f397c2c3db5dd33cc0502de3bd9b8e1864"},"text":"Problem-solving, which is calmly putting things right when they go wrong.","type":"list_item"},{"id":"c5ab547b-a618-54a8-a62d-6f8068eea735","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Everything in this book grows from those three ideas. The words and phrases are the tools, and warmth, attentiveness, and problem-solving are the hands that use them.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":52,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"f4def83678485d8d335cba0cb8f93c68405994bc0670b7955d4f32f6858760c3"},"text":"Everything in this book grows from those three ideas. The words and phrases are the tools, and warmth, attentiveness, and problem-solving are the hands that use them.","type":"paragraph"},{"id":"3e49f0b0-76ef-5edc-bd4f-b3f7d5b11468","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Guests may forget the exact words you said, but they will always remember how you made them feel. Every chapter trains both sides of that, the right English and the right hospitality.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":53,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","What customer care means"],"normalized_text_sha256":"1ee6c9ba53b7ce2c7545a4cd3a4be2a5f419a1065d7ee88afdbea51fd74c5373"},"text":"Guests may forget the exact words you said, but they will always remember how you made them feel. Every chapter trains both sides of that, the right English and the right hospitality.","type":"paragraph"}],"code":"HSP-C01-LS-03","order":3,"title":"What customer care means"},{"blocks":[{"id":"67bf2a82-8418-5351-8c45-fa1f7349e857","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"A few simple ideas sit underneath everything else in this book.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":56,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","Three ideas behind great service"],"normalized_text_sha256":"36c7140fc8697d508bd458b5d9be56548c0bab5b296bf60b27589a43642e1b67"},"text":"A few simple ideas sit underneath everything else in this book.","type":"paragraph"},{"id":"28f37660-f945-5113-95f0-6cf6f9156e1f","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"1. Every guest gives you a moment of truth.","underline":false},{"bold":false,"italic":false,"text":" A moment of truth is any small point of contact where a guest decides how they feel about you and the hotel. A greeting at the door, a phone answered on the second ring, a quick reply to a message. These moments are small, but they are exactly where trust is won or lost. Your English is the tool that helps you win them.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":57,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","Three ideas behind great service"],"normalized_text_sha256":"d2b2f87837de2f85d48b50876c54b188dd68fdc0f504e84f97fd1a29ab3de8ee"},"text":"1. Every guest gives you a moment of truth. A moment of truth is any small point of contact where a guest decides how they feel about you and the hotel. A greeting at the door, a phone answered on the second ring, a quick reply to a message. These moments are small, but they are exactly where trust is won or lost. Your English is the tool that helps you win them.","type":"list_item"},{"id":"b3457da4-2273-5105-a108-9fb75419a30e","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"2. You have two kinds of customers.","underline":false},{"bold":false,"italic":false,"text":" External customers are the guests who pay to stay. Internal customers are your own colleagues, such as housekeeping, the kitchen, or the manager you hand a request to. The warmth you show your colleagues usually flows straight through to the guest. Great service is a team habit before it is a guest habit.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":58,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","Three ideas behind great service"],"normalized_text_sha256":"736a8d366b4c99d2cbfba0a62ae06e67424edcf85e711f5e008ee753246b660c"},"text":"2. You have two kinds of customers. External customers are the guests who pay to stay. Internal customers are your own colleagues, such as housekeeping, the kitchen, or the manager you hand a request to. The warmth you show your colleagues usually flows straight through to the guest. Great service is a team habit before it is a guest habit.","type":"list_item"},{"id":"f7b1f4ed-f9ea-5bed-86f8-e6310c84f1ac","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"3. Warm words and the right attitude build loyalty.","underline":false},{"bold":false,"italic":false,"text":" When guests feel genuinely cared for, they come back and they tell other people. That is customer loyalty, and it is the real goal behind every phrase you are about to ","underline":false},{"bold":false,"italic":false,"text":"practise","underline":false},{"bold":false,"italic":false,"text":".","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":59,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","Three ideas behind great service"],"normalized_text_sha256":"6be505bdc10989c5ae48f1dd71e6f21c43ac3690fa2710a2a6328718c9f0481f"},"text":"3. Warm words and the right attitude build loyalty. When guests feel genuinely cared for, they come back and they tell other people. That is customer loyalty, and it is the real goal behind every phrase you are about to practise.","type":"list_item"},{"id":"9da8dbb7-70a1-55c9-80dd-91562d720fa8","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Useful words worth learning early: satisfaction, priority, essential, efficient, convenient, reliable, assist, and recommend. Try using two of them in a sentence about your own ideal hotel.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":60,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","Three ideas behind great service"],"normalized_text_sha256":"816965e55262d6fef9ecd307890ef6c2ea465ec62e9b5a9b8157d1bc6670f7f1"},"text":"Useful words worth learning early: satisfaction, priority, essential, efficient, convenient, reliable, assist, and recommend. Try using two of them in a sentence about your own ideal hotel.","type":"paragraph"}],"code":"HSP-C01-LS-04","order":4,"title":"Three ideas behind great service"},{"blocks":[{"id":"e1dfde14-11aa-5c4f-b133-6ba979c6506f","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Positive language means telling the guest what you can do instead of what you cannot. It is the same message with a far warmer feeling, and you will use it in every chapter, so it is worth getting comfortable with now.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":63,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","The one skill that runs through everything: positive language"],"normalized_text_sha256":"b825a7753eb688af9b29b37b700772195323f9e355dd636ee47aefd166e2ab8d"},"text":"Positive language means telling the guest what you can do instead of what you cannot. It is the same message with a far warmer feeling, and you will use it in every chapter, so it is worth getting comfortable with now.","type":"paragraph"},{"caption":"The one skill that runs through everything: positive language: Instead of saying this / Try saying this","header":["Instead of saying this","Try saying this"],"id":"e6fed742-d408-5f6b-9f15-00be742293cd","language":"en","order":2,"provenance_kind":"source_verbatim","rows":[["I do not know.","That is a good question. Let me find out for you."],["You have to fill in this form.","Could I ask you to fill in this short form, please?"],["Sorry, we are fully booked. No.","We are full that night, but let me check the nearby dates for you."],["That is not my job.","Let me connect you with the right person who can help."],["Please calm down.","I understand, and I am going to help you sort this out."]],"source_locator":{"artifact":"Hospitrainity.docx","body_index":64,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","The one skill that runs through everything: positive language"],"normalized_text_sha256":"f183bd4a37f5057987d2e01b55bdab3f139b2ea4ee4b20213631c8ad66b4f639"},"type":"source_table"},{"id":"b72c961d-6534-5c12-9386-5ddce798a554","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"The whole idea in one line: lead with what you can do, keep it warm, and always offer a next step.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":65,"chapter":1,"heading_path":["Welcome and Introduction to Customer Care","The one skill that runs through everything: positive language"],"normalized_text_sha256":"4aa29364d58604f492ef18c103247237c97807c5aeba0f54bba21d43b53fc39b"},"text":"The whole idea in one line: lead e only half the job. How you say them is the other half. Try these small habits:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":126,"chapter":2,"heading_path":["Front Desk and Check-In","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"7de8a89c05a37ce6aab71a093732d019386710801813f71817026a318461d116"},"text":"The words are only half the job. How you say them is the other half. Try these small habits:","type":"paragraph"},{"id":"c3b4db4a-2eb5-53bb-8f32-83ff0f58e1e6","language":"en","order":23,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Smile just before you speak. People really can hear a smile in your voice.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":127,"chapter":2,"heading_path":["Front Desk and Check-In","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"29cb2be3e581a0b69b444cb56ce94d3da194954dc0f9d806e58ba302c895f218"},"text":"Smile just before you speak. People really can hear a smile in your voice.","type":"list_item"},{"id":"8f2f0289-d90f-5932-b67a-c1d6f018875f","language":"en","order":24,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Use the guest’s name once you know it. “Thank you, Mr. Chen” instantly feels personal.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":128,"chapter":2,"heading_path":["Front Desk and Check-In","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"7166018ea06e6f963b63f66e62fc2f95d9e9ffc83b6eab5c11afc9527c717730"},"text":"Use the guest’s name once you know it. “Thank you, Mr. Chen” instantly feels personal.","type":"list_item"},{"id":"9d0a5dd1-012e-5e95-92ee-3fb3ea897a80","language":"en","order":25,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Slow down a little. Calm and clear is far more welcoming than fast.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":129,"chapter":2,"heading_path":["Front Desk and Check-In","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"e11643700f7398d4549a1f2736e93d90c04bd8b0622e93b83b4dca1573d3122b"},"text":"Slow down a little. Calm and clear is far more welcoming than fast.","type":"list_item"},{"id":"8bc07b65-4483-5f57-a665-bb887c02a2f0","language":"en","order":26,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Soften your requests with “Could I,” “May I,” and “please.” These tiny words do a lot of polite work.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":130,"chapter":2,"heading_path":["Front Desk and Check-In","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"4b5656d3784c0f27ed7e1971d1d2c1469734942f0782d8b402f2fa2f14b97d2c"},"text":"Soften your requests with “Could I,” “May I,” and “please.” These tiny words do a lot of polite work.","type":"list_item"}],"code":"HSP-C02-LS-05","order":5,"title":"Step 3. Useful phrases, grouped by what they do"},{"blocks":[{"id":"5fa58dd2-d206-546c-ae49-1eb83fc6fb13","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"R","underline":false},{"bold":false,"italic":false,"text":" stands for Receptionist, and ","underline":false},{"bold":true,"italic":false,"text":"G","underline":false},{"bold":false,"italic":false,"text":" stands for Guest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":133,"chapter":2,"heading_path":["Front Desk and Check-In","Step 4. Model dialogue"],"normalized_text_sha256":"cfc3517fb473908e51fa64decf51b5f6403086e4a4252590158ba7a31ac99b1e"},"text":"R stands for Receptionist, and G stands for Guest.","type":"paragraph"},{"id":"e0e94c4b-c1af-53a2-a698-3db82a46ccf9","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Good afternoon, welcome to the Grand Serenata Hotel. How may I help you?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Hi, I have a reservation under the name David Chen.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Thank you, Mr. Chen. Let me just find that for you. May I see your passport, please?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Sure, here you go.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Thank you. I have you in a Deluxe Room for two nights, checking out on Friday. Is that correct?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Yes, that is right.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Wonderful. We also take a small deposit at check-in, which is fully refunded when you leave. Is that alright?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" No problem.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Thank you. Here is your key card. Your room is 305, on the third floor. Breakfast is from 7 to 10 in the morning, and the Wi-Fi details are on this card.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Perfect. Is there a lift?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Yes, it is just around the corner to your left. Is there anything else I can help you with?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" No, that is all. Thank you.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"R:","underline":false},{"bold":false,"italic":false,"text":" Enjoy your stay, Mr. Chen. We are happy to have you.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":134,"chapter":2,"heading_path":["Front Desk and Check-In","Step 4. Model dialogue"],"normalized_text_sha256":"de6fcf6e2f04834cef50fff8b90a4cfcf5ebe74f6930c75b84100b3cc2012f57"},"text":"R: Good afternoon, welcome to the Grand Serenata Hotel. How may I help you?\nG: Hi, I have a reservation under the name David Chen.\nR: Thank you, Mr. Chen. Let me just find that for you. May I see your passport, please?\nG: Sure, here you go.\nR: Thank you. I have you in a Deluxe Room for two nights, checking out on Friday. Is that correct?\nG: Yes, that is right.\nR: Wonderful. We also take a small deposit at check-in, which is fully refunded when you leave. Is that alright?\nG: No problem.\nR: Thank you. Here is your key card. Your room is 305, on the third floor. Breakfast is from 7 to 10 in the morning, and the Wi-Fi details are on this card.\nG: Perfect. Is there a lift?\nR: Yes, it is just around the corner to your left. Is there anything else I can help you with?\nG: No, that is all. Thank you.\nR: Enjoy your stay, Mr. Chen. We are happy to have you.","type":"paragraph"},{"id":"37409c77-5d50-523f-8cb7-4e5f467933a9","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Notice what the receptionist did well: welcomed first, used the guest’s name, explained the deposit before taking it, and shared breakfast and Wi-Fi without being asked. That last part is the difference between good service and great service.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":135,"chapter":2,"heading_path":["Front Desk and Check-In","Step 4. Model dialogue"],"normalized_text_sha256":"f722da18d75363c45aacc9f1a92f2c2b1d88a3c9357c188aefb9cbd4b4fe4c62"},"text":"Notice what the receptionist did well: welcomed first, used the guest’s name, explained the deposit before taking it, and shared breakfast and Wi-Fi without being asked. That last part is the difference between good service and great service.","type":"paragraph"}],"code":"HSP-C02-LS-06","order":6,"title":"Step 4. Model dialogue"},{"blocks":[{"id":"706ababe-4115-5211-bafd-0c3df31a22ce","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Open for five common mistakes","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":138,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"a433b254794ec760d8fec78cc3f476ae28f47f15bd12cd32be5e9d650aac6f83"},"text":"Open for five common mistakes","type":"paragraph"},{"id":"f1c46cb1-d885-5372-b444-dd1ba2e6bd8a","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Asking for a passport before saying hello. Always welcome the guest first, then handle documents.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":139,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"74b1d2b8229543f714310bb295c18c5890693ac8dc0df66b10c803d0f8226986"},"text":"Asking for a passport before saying hello. Always welcome the guest first, then handle documents.","type":"list_item"},{"id":"69352457-07dd-5651-a606-50cb2df94311","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Saying “Give me your passport.” It sounds like an order. Say “Could I see your passport, please?” instead.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":140,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"27cfb380683847f4506bcc8d40b2143a8ce58cc22b5882fc20a338fbc96c47f9"},"text":"Saying “Give me your passport.” It sounds like an order. Say “Could I see your passport, please?” instead.","type":"list_item"},{"id":"7cb607e9-0c4b-55f0-a635-2bce6d58f9a4","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reading from the screen in a flat voice. Look up, make eye contact, and connect.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":141,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"42aff8befcecbb3b44ae427e227a8ff5a848c8d035e5aa956f662f7c5b3ffcbe"},"text":"Reading from the screen in a flat voice. Look up, make eye contact, and connect.","type":"list_item"},{"id":"ecc8b041-fb4f-5f85-b2be-57a2481375d1","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Forgetting to mention the floor, breakfast, and Wi-Fi. Guests almost always want these three.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":142,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"edacb7c550f30622d54845ca4851433e644e4d5c21528401af4c8f544dd2ac40"},"text":"Forgetting to mention the floor, breakfast, and Wi-Fi. Guests almost always want these three.","type":"list_item"},{"id":"92770130-b9ff-5e99-aab4-00e837747286","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Ending with a plain “Okay.” Close with warmth, such as “Enjoy your stay.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":143,"chapter":2,"heading_path":["Front Desk and Check-In","Common mistakes to avoid"],"normalized_text_sha256":"15d8e81f7265049455bd5a4d9c4761d2a09e6c9b5be38798ce179f7b65a65531"},"text":"Ending with a plain “Okay.” Close with warmth, such as “Enjoy your stay.”","type":"list_item"}],"code":"HSP-C02-LS-07","order":7,"title":"Common mistakes to avoid"},{"blocks":[{"id":"44de9b59-30ee-5f4b-bce9-6bd650c43e02","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Try each one first, then open the toggle to check yourself. Guessing before you check is what makes it stick.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":146,"chapter":2,"heading_path":["Front Desk and Check-In","Step 5. Practice"],"normalized_text_sha256":"c07577c05569a6e8f1e182cf52225d08cf103520bbd48760a23e04f6c5959b62"},"text":"Try each one first, then open the toggle to check yourself. Guessing before you check is what makes it stick.","type":"instruction"},{"id":"5b613f1a-96ac-5112-aff9-ed3177580fd7","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"1. Fill the blank with a polite verb:","underline":false},{"bold":false,"italic":false,"text":" “Could I ","underline":false},{"bold":false,"italic":false,"text":"_____","underline":false},{"bold":false,"italic":false,"text":" your passport, please?”","underline":false}],"source_locator":{"artifact":"Hospitr ator":{"artifact":"Hospitrainity.docx","body_index":161,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"8b5c1e17e91dac6eca1351f72f3ad5c3f74412725d84779192885e8a7d4310a7"},"text":"Guided mode (pick the best response, then check)","type":"heading"},{"id":"5857579a-05a1-55f1-9a9f-03dc71fda8e4","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “Hi, I think I have a booking, but I am not sure it went through.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":162,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"64e72b3eb24ffa2f22ea0659182d2115871220cbeaa06e10c7158eefb73f4335"},"speaker":"Guest","text":"“Hi, I think I have a booking, but I am not sure it went through.”","type":"dialogue_turn"},{"id":"b049c1a1-532f-550f-ae1e-a0990699beb4","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":163,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"5380d9ca-f66e-530f-af22-36915710c471","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “I do not know. Check your email.” This is unhelpful and pushes the problem back to the guest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":164,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"4f7f05e4e9175f601b6d8414783b8372424c8b3812f0b59738f7713092343c66"},"text":"(a) “I do not know. Check your email.” This is unhelpful and pushes the problem back to the guest.","type":"paragraph"},{"id":"dfa97bac-4ee4-55ea-abb9-214e8f714093","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “No problem at all, let me check that for you. May I have your name, please?” This is the ideal answer. It reassures the guest and moves calmly to the next step.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":165,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"2db395b597be9acaca240104c047558713a04b418fbf00559d5e1d1bfedab6b6"},"text":"(b) “No problem at all, let me check that for you. May I have your name, please?” This is the ideal answer. It reassures the guest and moves calmly to the next step.","type":"paragraph"},{"id":"b8f0f3c0-074e-5eed-bd98-b2d889c4e79f","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “That is not my job.” This is rude and unprofessional.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":166,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"73c851807aee8ffa1d09708b813e30950948cc8026e5f79f62dafbe15ce5a028"},"text":"(c) “That is not my job.” This is rude and unprofessional.","type":"paragraph"},{"id":"ddbcd22a-1694-53d6-adae-bc67b9c97a05","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “Can I have a room on a high floor with a nice view?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":167,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"19ec61b0ba70a955dd56302433b01306cce4cb45eba9fbbfacb55fded12faf32"},"speaker":"Guest","text":"“Can I have a room on a high floor with a nice view?”","type":"dialogue_turn"},{"id":"6980ca4e-89e6-55a9-acae-182b720c30d8","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":168,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"76eee390-9826-5d11-92ea-5033d0497d99","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “Let me see what I can do for you. We have a room on the fourth floor with a city view. Would that suit you?” This is the ideal answer, because it offers a solution warmly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":169,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"ec090d28c2b09b23e6e9a3ec7b450c90a40f48b13c826d0eaebbc0874c09cebc"},"text":"(a) “Let me see what I can do for you. We have a room on the fourth floor with a city view. Would that suit you?” This is the ideal answer, because it offers a solution warmly.","type":"paragraph"},{"id":"314f1b79-dd59-542b-84a3-488f3c09f0f7","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Maybe. We will see.” This is vague and sounds dismissive.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":170,"chapter":2,"heading_path":["Front Desk and Check-In","Step 6. Role-play"],"normalized_text_sha256":"4876bc8c57e2d6b5c0178b18e365935a4d02e8d5b2e9087df3a8296f00222330"},"text":"(b) “Maybe. We will see.” This is vague and sounds dismissive.","type":"paragraph"},{"id":"0f2a4f38-a5d5-5217-ac21-a17488d1203e","language":"en","order":11,"provenance_kind":"sourc ence check"],"normalized_text_sha256":"7831b9b1655261ee807dd6e8e3ddc00ca3104240995c2c77bdaa0c3831fbaad6"},"type":"activity_embed"}],"code":"HSP-C02-LS-11","order":11,"title":"Step 8. Confidence check"},{"blocks":[{"id":"e5c42f21-0457-5e65-afbf-d449ed9b6150","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"A useful challenge: record yourself doing a full check-in out loud, from the first greeting to the final goodbye, in under ninety seconds. Play it back once and ask yourself two questions: did I sound warm, and did I use the guest’s name? Try it a second time and keep the better take. Speaking out loud is where real confidence is built.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":213,"chapter":2,"heading_path":["Front Desk and Check-In","Take it further"],"normalized_text_sha256":"121c0072abff35afcec861c39c56b21327d35ed966cd47740efc22ba6413890d"},"text":"A useful challenge: record yourself doing a full check-in out loud, from the first greeting to the final goodbye, in under ninety seconds. Play it back once and ask yourself two questions: did I sound warm, and did I use the guest’s name? Try it a second time and keep the better take. Speaking out loud is where real confidence is built.","type":"paragraph"},{"id":"a3e7f52c-ceec-5e2a-8cbb-fcf9b26ff7b9","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"First impressions and body language","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":215,"chapter":2,"heading_path":["Front Desk and Check-In","Take it further"],"normalized_text_sha256":"4d63d1895af6fa480e2f5cbd114fef8490f0b5188bd43c0941245604fcfe1b70"},"text":"First impressions and body language","type":"heading"},{"id":"161fc896-fa67-58b3-9c33-1217d83e5e11","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"When you meet a guest face to face, they read your body language and hear your tone before they fully take in your words, so a warm welcome is built from far more than sentences. Three things make a strong first impression, and they cost nothing:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":216,"chapter":2,"heading_path":["Front Desk and Check-In","Take it further"],"normalized_text_sha256":"aaefe05d97ddc066de5744527d0a51db7147edcb6d57fc93f8ee8046066c81df"},"text":"When you meet a guest face to face, they read your body language and hear your tone before they fully take in your words, so a warm welcome is built from far more than sentences. Three things make a strong first impression, and they cost nothing:","type":"paragraph"},{"id":"1a5e2001-154c-5dd2-875a-9e077363e3e0","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"A genuine smile and friendly eye contact. They quietly say “you are welcome here” before you speak a word.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":217,"chapter":2,"heading_path":["Front Desk and Check-In","Take it further"],"normalized_text_sha256":"6b1ba83de249bb3924a7ffe97f07886c19de504cbb752d4bf3262f63c59c42eb"},"text":"A genuine smile and friendly eye contact. They quietly say “you are welcome here” before you speak a word.","type":"list_item"},{"id":"cba1b8bc-4e50-55bf-b2cc-4c8ef42d51c8","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Open, relaxed posture. Face the guest, keep your hands calm, and try not to hide behind the screen.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":218,"chapter":2,"heading_path":["Front Desk and Check-In","Take it further"],"normalized_text_sha256":"b3072f288b8c92a444b3795adc0779153ce2a15f7d8863adb781f1f3c696b602"},"text":"Open, relaxed posture. Face the guest, keep your hands calm, and try not to hi ndency","transcript"],"cefr_activity":"interaction","channel":"telecommunications","code":"HSP-C03-ACT-ROLEPLAY","completion_rule":"all_required_responses_and_self_checks_completed","guidance":null,"lesson_code":"HSP-C03-LS-09","outcome_codes":["OUT-M03-01","OUT-M03-02","OUT-M03-03"],"participation":"staff_guest","pedagogical_function":"freer_task","prompts":[{"accepted_normalized":[],"answers":[],"choices":[],"code":"HSP-C03-RP-FREE","correct_choice_ids":[],"correct_order":[],"feedback":[{"feedback_type":"model_reveal","text":"“Good afternoon, the Grand Serenata Hotel, Maya speaking. How may I help you? ... I would be happy to help. Let me check availability for those two nights. ... Yes, we have a room. Could I take your name and a contact number? ... Let me read that back to be sure. ... Your booking reference is four, five, three. Thank you for calling, and we look forward to welcoming you.”"}],"rating_scale":null,"response_constraints":{"audio_storage":"disabled","maximum_characters":6000,"minimum_non_whitespace_characters":1},"response_form":"role_play","scoring_mode":"model_self_check","self_check_required":true,"stem":"Prompt: A caller wants to book two nights next week. Answer the phone, take the booking, confirm the details, and close the call.","tokens":[]},{"accepted_normalized":[],"answers":["b"],"choices":[{"feedback":[{"feedback_type":"error_specific","text":"(a) “I do not know.” Unhelpful, and it leaves the caller stuck."}],"id":"6d3eda24-35a3-5c1c-84df-984a137adeb3","label":"a","text":"“I do not know.”"},{"feedback":[{"feedback_type":"success","text":"(b) “Let me check availability for Saturday for you. One moment, please.” This is the ideal answer, calm and action-focused."}],"id":"1b82907f-3dfa-5bf2-966d-a30c99a6c4a3","label":"b","text":"“Let me check availability for Saturday for you. One moment, please.”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) “Probably not.” Vague and discouraging."}],"id":"bc070e9d-4a95-536a-9ecb-9366eb58b2ad","label":"c","text":"“Probably not.”"}],"code":"HSP-C03-RP-G1","correct_choice_ids":["1b82907f-3dfa-5bf2-966d-a30c99a6c4a3"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “I do not know.” Unhelpful, and it leaves the caller stuck."},{"feedback_type":"success","text":"(b) “Let me check availability for Saturday for you. One moment, please.” This is the ideal answer, calm and action-focused."},{"feedback_type":"error_specific","text":"(c) “Probably not.” Vague and discouraging."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"Caller: “Do you have any rooms for this Saturday?”","tokens":[]},{"accepted_normalized":[],"answers":["b"],"choices":[{"feedback":[{"feedback_type":"error_specific","text":"(a) “I already said it.” Rude, and it makes the caller feel bad."}],"id":"7927cf52-b139-5ea3-81b4-c209a46e3e9a","label":"a","text":"“I already said it.”"},{"feedback":[{"feedback_type":"success","text":"(b) “Of course. Your booking reference is four, five, two. Shall I say it again slowly?” This is the ideal answer, patient and clear."}],"id":"261b42cb-f9c9-57c6-95ba-980937d2ae8e","label":"b","text":"“Of course. Your booking reference is four, five, two. Shall I say it again slowly?”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) Hanging up. Never do this."}],"id":"4a0d0688-e612-5eaa-a881-2182a1945e4f","label":"c","text":"Hanging up."}],"code":"HSP-C03-RP-G2","correct_choice_ids":["261b42cb-f9c9-57c6-95ba-980937d2ae8e"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “I already said it.” Rude, and it makes the caller feel bad."},{"feedback_type":"success","text":"(b) “Of course. Your booking reference is four, five, two. Shall I say it again slowly?” This is the ideal answer, patient and clear."},{"feedback_type":"error_specific","text":"(c) Hanging up. Never do this."}],"rating_scale":null,"response_c ON","descriptor":"Offers help and moves toward a concrete solution","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C03-RP-RUBRIC-POLITENESS","descriptor":"Polite, softened language (e.g. \"Could I ... please\")","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C03-RP-RUBRIC-PROGRESSION","descriptor":"Calmly moves the interaction to the next step","levels":["Not yet","Developing","Strong"]}]},"scoring_mode":"mixed","timing":"synchronous","title":"Step 6. Role-play"}],"code":"HSP-C03","module":3,"outcome_codes":["OUT-M03-01","OUT-M03-02","OUT-M03-03"],"sections":[{"blocks":[{"id":"a2e5c57c-4010-5f67-a64f-7dde141d4faf","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answer these quietly for yourself first. No right or wrong answers, just a gentle way to warm up.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":233,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Warm-Up"],"normalized_text_sha256":"cb7a22a59a1691989c2458152e98537c88ae09ffaa722ff92a23d36e59214da3"},"text":"Answer these quietly for yourself first. No right or wrong answers, just a gentle way to warm up.","type":"instruction"},{"id":"2b71206a-93c4-516f-bc38-7c096822980d","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In one word, how do you feel about speaking English on the phone?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":234,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Warm-Up"],"normalized_text_sha256":"27fb4135b049a0f99b6830b57c5819c6aae1e6d721e59493b71fce935d6c6a06"},"text":"In one word, how do you feel about speaking English on the phone?","type":"list_item"},{"id":"c03a5592-8ac2-576a-bd7d-d717c40d3a45","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"When did you last call a business? What were the very first words you said?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":235,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Warm-Up"],"normalized_text_sha256":"66f9f7fa86105453b42d7dc4ed4e47c6e445d0f0cb4373ceae54d77f96b91f36"},"text":"When did you last call a business? What were the very first words you said?","type":"list_item"},{"id":"ecfbf3fd-b35e-53b3-955d-830b40540383","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In your own language, how do you answer a work phone politely?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":236,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Warm-Up"],"normalized_text_sha256":"2670785d8d001b89cb7710a6852f65b51b954cdc9fe1b83d7544b134cd54c45a"},"text":"In your own language, how do you answer a work phone politely?","type":"list_item"}],"code":"HSP-C03-LS-01","order":1,"title":"Warm-Up"},{"blocks":[{"id":"c2df4fbd-37f1-5980-b932-fb0df16e72b7","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"A phone call is often a guest’s first contact with your hotel, sometimes even before they have decided to book. Because they cannot see you, everything they judge comes through in your tone, your clarity, and how carefully you confirm what they said. One skill sits underneath all of this, and it is active listening, which simply means truly paying attention, then repeating key details back so the guest knows they were heard.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":238,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Why this matters"],"normalized_text_sha256":"b6459d151897f8e8bf9e56ef8cb4e2266aca8dcde8fc1a9ef26b265bef718cfd"},"text":"A phone call is often a guest’s first contact with your hotel, sometimes even before they have decided to book. Because they cannot see you, everything they judge comes through in your tone, your clarity, and how carefully you confirm what they said. One skill sits underneath all of this, and it is active listening, which simply means truly paying attention, then repeating key details back so the guest knows they were heard.","type":"paragraph"},{"id":"e4c2c20a-c2c6-5684-aa50-d9e52909e82e","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Good to know: it helps to listen twice as much as you speak. On the phone, reading details back to the caller is one of the easiest ways to prevent mistakes and build trust. See the further reading at the end of this chapter.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":239,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Why this matters"],"normalized_text_sha256":"b7aceff5a1327b7d8fbb75c8360a52f57cf5aae066ace64b95da9751ef518bc8"},"text":"Good to know: it helps to listen twice as much as you speak. On the phone, reading details back to the caller is one of the easiest ways to prevent mistakes and build trust. See the further reading at the end of this chapter.","type":"paragraph"}],"code":"HSP-C03-LS-02","order":2,"title":"Why this matters"},{"blocks":[{"id":"b3b49f5f-2270-560a-b699-40b6bb8742d7","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"You are a reservations agent at the Grand Serenata Hotel.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":242,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"49baa99d65ad2c8f880c9ca3cd0349b607fb7cdb2f484d4d43317302c2530e1a"},"text":"You are a reservations agent at the Grand Serenata Hotel.","type":"heading"},{"id":"1bfa54b9-b2ac-563f-a83f-7e55f092ec81","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"The phone rings. The caller might want to check availability, make a booking, or simply ask a question. Your job flows in a natural order:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":243,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"d323dce7e299d0f2bbd9fa58028978df5679ea5128c258cecdd35a21931fa1c2"},"text":"The phone rings. The caller might want to check availability, make a booking, or simply ask a question. Your job flows in a natural order:","type":"paragraph"},{"id":"28bd0247-95fd-5d3c-ac28-0f4d89391075","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Answer","underline":false},{"bold":false,"italic":false,"text":" professionally, with the hotel name, your name, and an offer of help.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":244,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"837e9e567924b39b2016805dabd020782fa311fb9fb0e69ad864ad430758ed7a"},"text":"Answer professionally, with the hotel name, your name, and an offer of help.","type":"list_item"},{"id":"a4f444f9-0a00-5037-ae63-c97776caa8d5","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Listen","underline":false},{"bold":false,"italic":false,"text":" carefully and work out what the caller needs.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":245,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"74c35c6477b21aef29ea0b6b7a81138c0ce6c311fc4f43b6abdb025dbaf9a1b8"},"text":"Listen carefully and work out what the caller needs.","type":"list_item"},{"id":"105c0095-e258-5cb3-98cb-37e341c6cbda","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Take","underline":false},{"bold":false,"italic":false,"text":" the details, such as the dates, room type, name, and contact number.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":246,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"bb43b0368ad64da8c357035587d784fd75b47d15b7a4c07075de05cc0a1d0f60"},"text":"Take the details, such as the dates, room type, name, and contact number.","type":"list_item"},{"id":"bcb51aff-278e-5ffa-8e63-3822934c7650","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Confirm","underline":false},{"bold":false,"italic":false,"text":" by reading everything back, and spell names or repeat numbers slowly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":247,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"63a2db74ec29d255d58c0d57c421070e1e2ca67f46d4ef159157e5298d8587f5"},"text":"Confirm by reading everything back, and spell names or repeat numbers slowly.","type":"list_item"},{"id":"c6e2e724-0c2d-50ac-9d51-905c87f998e4","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Give","underline":false},{"bold":false,"italic":false,"text":" the booking reference and close on a warm note.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":248,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"5eabd7706b7eda031efae8bb05202cf7feede151ec9d70e7626f41e0422a01db"},"text":"Give the booking reference and close on a warm note.","type":"list_item"},{"id":"e0c99570-dce0-55c2-9598-f57113bb78da","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Because the caller cannot see you, small things matter more, such as a friendly voice and a clear, unhurried pace.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":249,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 1. The scenario"],"normalized_text_sha256":"f91dcac9fa3dc34ff517b382616e7469695fc2db04703093b0521a8d5b6a1975"},"text":"Because the caller cannot see you, small things matter more, such as a friendly voice and a clear, unhurried pace.","type":"paragraph"}],"code":"HSP-C03-LS-03","order":3,"title":"Step 1. The scenario"},{"blocks":[{"id":"557df2fb-b008-5cf3-bfe6-0e895a5ab0eb","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Read each example out loud once. Hearing yourself say the word is the quickest way to make it yours.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":252,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 2. Key vocabulary"],"normalized_text_sha256":"9062029490451d76c9546e11613be747dc0eeae4cca9da63498981b2682e73e4"},"text":"Read each example out loud once. Hearing yourself say the word is the quickest way to make it yours.","type":"instruction"},{"caption":"Step 2. Key vocabulary: Word or phrase / What it means / How you might say it","header":["Word or phrase","What it means","How you might say it"],"id":"7745a078-ab7f-5465-b092-c44aa435170b","language":"en","order":2,"provenance_kind":"source_verbatim","rows":[["to put on hold","to pause a call politely","“May I put you on hold for a moment?”"],["availability","whether rooms are free","“Let me check availability for you.”"],["room rate","the price for one night","“The room rate is 80 dollars per night.”"],["to spell out","to say a word letter by letter","“Could you spell that out for me?”"],["to read back","to repeat details to confirm them","“Let me read that back to you.”"],["extension","an internal phone number","“You can reach me on extension 12.”"],["to take a message","to note information for someone else","“May I take a message?”"],["booking reference","the code for a reservation","“Your booking reference is 452.”"],["to transfer a call","to pass a call to another person","“I will transfer your call now.”"],["enquiry","a question or request for information","“Thank you for your enquiry.”"],["to hang up","to end a call","“Please do not hang up.”"],["caller","the person who is phoning","“The caller would like a quiet room.”"]],"source_locator":{"artifact":"Hospitrainity.docx","body_index":253,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 2. Key vocabulary"],"normalized_text_sha256":"e535be7090d8cc7b79143e0d002a04e6c63d66a972a24cbaacf96cd75028a8d8"},"type":"source_table"},{"id":"a31458ce-af91-5d63-a337-0776c0ed9b40","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Spelling tip: when a name is tricky, use the clear-word alphabet, such as “B for Bravo, C for Charlie.” It sounds professional and it prevents mix-ups. For numbers, say them in single digits, so 452 becomes “four, five, two.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":254,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 2. Key vocabulary"],"normalized_text_sha256":"27aa432dcf834fdd32658d40b6e02dc3a8d4be91e339400ac8bfc4e196bc96d9"},"text":"Spelling tip: when a name is tricky, use the clear-word alphabet, such as “B for Bravo, C for Charlie.” It sounds professional and it prevents mix-ups. For numbers, say them in single digits, so 452 becomes “four, five, two.”","type":"paragraph"}],"code":"HSP-C03-LS-04","order":4,"title":"Step 2. Key vocabulary"},{"blocks":[{"id":"a5b14a86-beca-56cf-8b4c-e84ee779692b","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Answering the call","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":257,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"4f57cf981f3024dc3e11dfcf912cdefedf41428ec5d3987d77134adc8b94433f"},"text":"Answering the call","type":"heading"},{"id":"f8b5b54c-224e-5aeb-b4d6-18cb48ca5b53","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Good morning, the Grand Serenata Hotel, Maya speaking. How may I help you?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":258,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"eb48a4e0d0fa79fccf38b7ed42bab5774e18247ca7230b333d82aa45183a878d"},"text":"“Good morning, the Grand Serenata Hotel, Maya speaking. How may I help you?”","type":"list_item"},{"id":"201eff43-c48b-5f60-bf32-ef2dd851732c","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Checking availability","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":259,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"93faa3c57234fc2c0abd6d2a0b516ea59af9de9f40dd3c2b7b0544ea424000ee"},"text":"Checking availability","type":"heading"},{"id":"182477dc-bc6c-5c54-bfa1-a2e728381fbd","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Let me check availability for those dates for you.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":260,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"b1bad1dbab89a2edc4a63ffc67c7a2cef452b8a1a883e2c315873a9aa723e84f"},"text":"“Let me check availability for those dates for you.”","type":"list_item"},{"id":"a050adc1-639e-5ef8-839e-bb3e724e98e9","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Putting someone on hold kindly","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":261,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"9ec8f71812c16aa435059a3ba54fb8f5f6802caccff50454b3c420f85df3f909"},"text":"Putting someone on hold kindly","type":"heading"},{"id":"bf3a211c-4ca9-5889-af0c-35371d9fdebd","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“May I put you on hold for just a moment? Thank you for waiting.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":262,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"c9bcd33ab14ddd274d1a899cad773d5d0f3136f8c0a53672f56755865889e26f"},"text":"“May I put you on hold for just a moment? Thank you for waiting.”","type":"list_item"},{"id":"81fd9ce2-22ed-5121-8eb8-37840faa40d9","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Taking the details","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":263,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"e4410c0a83e0973cc4feb147091da77d30da594b3d10a6fd787c27563e1e1625"},"text":"Taking the details","type":"heading"},{"id":"0ad5fe8e-4fc3-56a2-a754-b2ccd1428fe5","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Could I take your name and a contact number, please?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":264,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"76f885293bfa7ccaed44793da113a815c18616fdfbb4691845d2421162d9addd"},"text":"“Could I take your name and a contact number, please?”","type":"list_item"},{"id":"e2c35646-e323-5043-8c73-365fed04b341","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Confirming and spelling","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":265,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"5995b690609b2c2b328d517f760c45b86ca3f2b02c8beb6f0d0d8836ba54f648"},"text":"Confirming and spelling","type":"heading"},{"id":"dc5cfb6d-6adb-58a7-8eb8-a42ed8a18c09","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Let me read that back to make sure I have it right. A Deluxe Room for two nights, arriving on the fifth. Could you spell your last name for me?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":266,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"a6e297c6aeee92a9edad6903c293302096fa0407d8339bb91a9e2c33edc3ab68"},"text":"“Let me read that back to make sure I have it right. A Deluxe Room for two nights, arriving on the fifth. Could you spell your last name for me?”","type":"list_item"},{"id":"3b280a42-6c63-50df-bfc5-2e37871a6c48","language":"en","order":11,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Transferring politely","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":267,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"cc1a161d5c79dc6b8bba32c4c668ca4826e576fd0fb83a2e8a422e4580b24800"},"text":"Transferring politely","type":"heading"},{"id":"9d0b3a99-fa59-5e8d-bfec-662231288613","language":"en","order":12,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“I will put you through to our restaurant now. One moment, please.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":268,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"a8c15db2d90c78f2f9d7360b7564c4428e6c9366dd0c51adfdef4f8ba0d44232"},"text":"“I will put you through to our restaurant now. One moment, please.”","type":"list_item"},{"id":"7e952e6b-2814-5792-8c4e-8a86f1897c82","language":"en","order":13,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Closing warmly","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":269,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"13fafe65d59a7f40daee00f5591cb9c47d0434b5577aba2841178b9b1386a4a8"},"text":"Closing warmly","type":"heading"},{"id":"e09e0ff7-ca0c-54da-a43f-84b4400d8858","language":"en","order":14,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"“Your booking reference is four, five, two. Thank you for calling, and we look forward to welcoming you.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":270,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"d4a5cfda6b0094c3695eac014de9bbf26ebd7c279f72e6abb6ef91005ebc3bda"},"text":"“Your booking reference is four, five, two. Thank you for calling, and we look forward to welcoming you.”","type":"list_item"},{"id":"f4cecd0c-9950-5df3-a9a5-8990b8cc546e","language":"en","order":15,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Sounding warm when they cannot see you","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":272,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"fa320516e669027b649e75694db4f734e4ea98042b856a324b27bc3488883264"},"text":"Sounding warm when they cannot see you","type":"heading"},{"id":"b700ba5a-61db-5622-bf62-ebdabfb3f4b8","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Your voice is your only tool on the phone, so give it a little care:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":273,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"4379056ea6fa35e466765ad556bfd2e538cd19c9b26a9e3aabf7efdee16d23d2"},"text":"Your voice is your only tool on the phone, so give it a little care:","type":"paragraph"},{"id":"7935c877-1094-55bd-9594-9b0d3c95edd0","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Smile as you answer. It genuinely changes how your voice sounds.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":274,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"7c4f1840d9818b7ec6c88582a14c376deba45ee26b35bfa20d21a6567771eb90"},"text":"Smile as you answer. It genuinely changes how your voice sounds.","type":"list_item"},{"id":"c0ca8d3e-0036-5a28-bfad-f6a6f0c4e908","language":"en","order":18,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Slow down, especially with numbers and names. Clear is kind.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":275,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"af09ca7a5b2868ed473ada7f1ce164e672a3db0316586941dc598d448ae3d69f"},"text":"Slow down, especially with numbers and names. Clear is kind.","type":"list_item"},{"id":"55137e50-c93e-5d48-ad96-2cba2b8d5736","language":"en","order":19,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Use small listening sounds, such as “of course” and “right,” so the caller knows you are still there.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":276,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"ccaec922aef26df3bb7c1f3520dbd3a971f036dd304e07a71a37bd0940bd8374"},"text":"Use small listening sounds, such as “of course” and “right,” so the caller knows you are still there.","type":"list_item"},{"id":"43e71e3c-d270-587c-a8eb-d2845f90c785","language":"en","order":20,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Never interrupt. Let the caller finish, then confirm what you heard.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":277,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"3d014f3ee46fdbf131206c0b31422eb5ef5a4dbdb7aab9144a3e414d52feb231"},"text":"Never interrupt. Let the caller finish, then confirm what you heard.","type":"list_item"}],"code":"HSP-C03-LS-05","order":5,"title":"Step 3. Useful phrases, grouped by what they do"},{"blocks":[{"id":"24ec596e-29e5-53f7-b56f-c53a6bf77aad","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A","underline":false},{"bold":false,"italic":false,"text":" stands for Agent, and ","underline":false},{"bold":true,"italic":false,"text":"C","underline":false},{"bold":false,"italic":false,"text":" stands for Caller.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":280,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 4. Model dialogue"],"normalized_text_sha256":"4fff3ea8628d205f06329f7baac2b5e8e020e353e84435fd84f1014a12746b5d"},"text":"A stands for Agent, and C stands for Caller.","type":"paragraph"},{"id":"0af6308c-173a-5688-807e-5e93483b634c","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Good morning, the Grand Serenata Hotel, Maya speaking. How may I help you?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"C:","underline":false},{"bold":false,"italic":false,"text":" Hi, I would like to book a room for next weekend.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" I would be happy to help with that. May I have the dates, please?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"C:","underline":false},{"bold":false,"italic":false,"text":" Friday the fifth to Sunday the seventh.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Let me check availability for those dates. Thank you for waiting. Yes, we have a Deluxe Room available at 80 dollars per night. Would you like me to book it for you?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"C:","underline":false},{"bold":false,"italic":false,"text":" Yes, please.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Lovely. Could I take your name and a contact number?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"C:","underline":false},{"bold":false,"italic":false,"text":" David Chen, and my number is 0812 3456 7890.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Thank you. Let me read that back to be sure. David Chen, a Deluxe Room, two nights, arriving Friday the fifth. Is that correct?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"C:","underline":false},{"bold":false,"italic":false,"text":" That is correct.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Your booking reference is four, five, two. Thank you for calling, Mr. Chen. We look forward to welcoming you.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":281,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 4. Model dialogue"],"normalized_text_sha256":"999ae2591f0d4fbb70232f97431fbb452d3cd313c8150ff26d285d7a8dc441e4"},"text":"A: Good morning, the Grand Serenata Hotel, Maya speaking. How may I help you?\nC: Hi, I would like to book a room for next weekend.\nA: I would be happy to help with that. May I have the dates, please?\nC: Friday the fifth to Sunday the seventh.\nA: Let me check availability for those dates. Thank you for waiting. Yes, we have a Deluxe Room available at 80 dollars per night. Would you like me to book it for you?\nC: Yes, please.\nA: Lovely. Could I take your name and a contact number?\nC: David Chen, and my number is 0812 3456 7890.\nA: Thank you. Let me read that back to be sure. David Chen, a Deluxe Room, two nights, arriving Friday the fifth. Is that correct?\nC: That is correct.\nA: Your booking reference is four, five, two. Thank you for calling, Mr. Chen. We look forward to welcoming you.","type":"paragraph"},{"id":"2cc9e86e-b4f5-5045-b730-e239d5218100","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Notice the rhythm: listen, check, then confirm. The agent thanked the caller for waiting, read the details back in full, and gave the booking reference in single digits. That is exactly how you avoid errors over the phone.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":282,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 4. Model dialogue"],"normalized_text_sha256":"da6b9153b2a1ea17f4e89668e3a23b0bd022808fa871c7ebe680415251549bcd"},"text":"Notice the rhythm: listen, check, then confirm. The agent thanked the caller for waiting, read the details back in full, and gave the booking reference in single digits. That is exactly how you avoid errors over the phone.","type":"paragraph"}],"code":"HSP-C03-LS-06","order":6,"title":"Step 4. Model dialogue"},{"blocks":[{"id":"6282bafd-03e9-533c-a8f2-2386fb42c2ee","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Open for five common mistakes","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":285,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Common mistakes to avoid"],"normalized_text_sha256":"a433b254794ec760d8fec78cc3f476ae28f47f15bd12cd32be5e9d650aac6f83"},"text":"Open for five common mistakes","type":"paragraph"},{"id":"7f1e51e6-19be-5463-8062-aa2e6d975d92","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answering with just “Hello.” Always give the hotel name, your name, and an offer to help.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":286,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Common mistakes to avoid"],"normalized_text_sha256":"378f51d0b049a44a911e8179ef1b05d3bd4081448cdf4f6aba6f75300b50689a"},"text":"Answering with just “Hello.” Always give the hotel name, your name, and an offer to help.","type":"list_item"},{"id":"3e59fb1e-525c-5cf0-8d93-cf5c1407cb4f","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Rushing through numbers. Slow down and say each digit on its own.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":287,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Common mistakes to avoid"],"normalized_text_sha256":"541abc07664409f58404f4f6240b6f74358dc0192473f39bd1580d2a6676b71b"},"text":"Rushing through numbers. Slow down and say each digit on its own.","type":"list_item"},{"id":"8cab924b-9138-5728-8adf-f048914f01bd","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Not confirming. Always read the booking back before you finish.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":288,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Common mistakes to avoid"],"normalized_text_sha256":"0a0e1b562c794cab76179e37b0701eb655b4da04f6abf54e5cea532e208b5356"},"text":"Not confirming. Always read the booking back before you finish.","type":"list_item"},{"id":"5cf42888-3dda-5faa-9b33-fe748e09ef40","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Putting someone on hold without asking. Ask first, and thank them when you return.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":289,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Common mistakes to avoid"],"normalized_text_sha256":"ec0b e best phone opener: (a) “Hello?” or (b) “Good morning, the Grand Serenata Hotel, Maya speaking. How may I help you?”","type":"list_item"},{"id":"f0192c8c-a5f2-5885-9f04-7166bbe48890","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Check answer","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":298,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 5. Practice"],"normalized_text_sha256":"59b5b25c3f1225bbc759f0a5877604948e64e3484f2e56aafef146d98cd32a61"},"text":"Check answer","type":"paragraph"},{"id":"b7ed0f84-32ea-50dd-bca9-0c12adc3d278","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"(b).","underline":false},{"bold":false,"italic":false,"text":" It names the hotel and you, then offers help. A clear opener sets a professional tone from the first second.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":299,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 5. Practice"],"normalized_text_sha256":"a1575ead73acef37095b9094adfb107e11cdfbe71b77f69145223581a0ac6a01"},"text":"(b). It names the hotel and you, then offers help. A clear opener sets a professional tone from the first second.","type":"paragraph"},{"id":"52a6af1d-dbcc-5c91-917f-6cef7d16e01f","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"3. Put these phone steps in order:","underline":false},{"bold":false,"italic":false,"text":" give the booking reference, answer with the hotel name, take the caller’s details, confirm by reading back.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":300,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Step 5. Practice"],"normalized_text_sha256":"67aa61d265afa3a415fb2dc07d567f80c49d8fbf91f1895bfc0980574be3bfd3"},"text":"3. Put these phone steps in :11,"title":"Step 8. Confidence check"},{"blocks":[{"id":"f7c46171-f44c-51bc-b4d3-b162592dc958","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Grab a friend or your phone. Have someone read you a name and a phone number fairly quickly, then ","underline":false},{"bold":false,"italic":false,"text":"practise","underline":false},{"bold":false,"italic":false,"text":" reading it back correctly and giving a booking reference in single digits. Do it three times. This short drill builds the exact confidence you need for real calls, where listening and confirming are everything.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":360,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_text_sha256":"a5be93382fbf35da26b64aea10dad06b0b44d3029e5454d78ba874ed3ebdd48a"},"text":"Grab a friend or your phone. Have someone read you a name and a phone number fairly quickly, then practise reading it back correctly and giving a booking reference in single digits. Do it three times. This short drill builds the exact confidence you need for real calls, where listening and confirming are everything.","type":"paragraph"},{"id":"cb1f4729-26af-54aa-8fbf-81662afedc8b","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Telephone manner","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":362,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_text_sha256":"1bb4acc6acb384dd7acd11afef3d3751017ec51514fd3d2ee40b667564722d25"},"text":"Telephone manner","type":"heading"},{"id":"8163e829-ba03-53f2-b81b-9f2f462c5ee9","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"On the phone, your voice has to carry all of the welcome, so a few habits instantly mark you out as a professional.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":363,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_text_sha256":"6144d2c872f3b595f15656195a547bdcef5c4c2689cd5fe9385e1f7ad6e864d4"},"text":"On the phone, your voice has to carry all of the welcome, so a few habits instantly mark you out as a professional.","type":"paragraph"},{"id":"ec0e53d7-8348-56b4-b8e6-007b8b302c5c","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answer promptly, then give the hotel name, your name, and an offer of help.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":364,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_text_sha256":"dddcb4e6a5b130770fc55f39229a0e54e1b8cfc74c7d0cd99d32df11cc3adb44"},"text":"Answer promptly, then give the hotel name, your name, and an offer of help.","type":"list_item"},{"id":"be574eed-28cb-5ac4-bd6f-13da0c54e1fe","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Keep a smile in your voice, because callers really can hear it.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":365,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_text_sha256":"fabc36f69dcc18c6358f6b1dc05b8e3d34323bd8fabaafa1ffc6bc3772825eb6"},"text":"Keep a smile in your voice, because callers really can hear it.","type":"list_item"},{"id":"b33e90d7-ca1c-52a1-8528-5d34ec6ab423","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Take careful messages whenever someone is unavailable, and always read them back.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":366,"chapter":3,"heading_path":["Dealing with Customers on the Phone","Take it further"],"normalized_
