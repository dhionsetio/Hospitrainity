 hotline or a call ","underline":false},{"bold":false,"italic":false,"text":"centre","underline":false},{"bold":false,"italic":false,"text":"? What made it feel good, or not so good?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":382,"chapter":4,"heading_path":["The Guest-Services Hotline","Warm-Up"],"normalized_text_sha256":"4d48913f60eaf3156b31938db427e63ce6d51823334f0b17e41741da122f589e"},"text":"Have you ever called a hotline or a call centre? What made it feel good, or not so good?","type":"list_item"},{"id":"e767484b-cf5d-5e0c-b9bf-5a0cd308781e","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In your own language, how do you politely ask someone to wait, or move them to another person?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":383,"chapter":4,"heading_path":["The Guest-Services Hotline","Warm-Up"],"normalized_text_sha256":"b387a12eff7e78a4eeab3a76d0656db2d39d18ddab9d36d63259e97186dec988"},"text":"In your own language, how do you politely ask someone to wait, or move them to another person?","type":"list_item"}],"code":"HSP-C04-LS-01","order":1,"title":"Warm-Up"},{"blocks":[{"id":"e0581298-0299-52bd-b5e7-67d06510b77a","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"On a busy hotline, the guest cannot see how many other calls you are juggling, and they should not have to. What they feel is simply whether you listened and whether you got their order right. This is where active listening earns its keep, because repeating the order back is the easiest way to catch a mistake before it reaches the kitchen. A calm voice and an accurate read-back can make even a thirty-second call feel like great service.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":385,"chapter":4,"heading_path":["The Guest-Services Hotline","Why this matters"],"normalized_text_sha256":"05e8afcbe6fffcd64c029e2f84ea8a0c140fc6e8f1cda6172a8787dcf5d1eb39"},"text":"On a busy hotline, the guest cannot see how many other calls you are juggling, and they should not have to. What they feel is simply whether you listened and whether you got their order right. This is where active listening earns its keep, because repeating the order back is the easiest way to catch a mistake before it reaches the kitchen. A calm voice and an accurate read-back can make even a thirty-second call feel like great service.","type":"paragraph"},{"id":"6647ccbb-34e2-5c27-9a8e-81d749e231a7","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Good to know: active listening reduces repeat calls and misunderstandings, because the guest does not have to explain themselves twice. See the further reading at the end of this chapter.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":386,"chapter":4,"heading_path":["The Guest-Services Hotline","Why this matters"],"normalized_text_sha256":"84dc371b7d0dabd9bd1ab90bfec75726b920993ba18772ff4a4543b52eb0079b"},"text":"Good to know: active listening reduces repeat calls and misunderstandings, because the guest does not have to explain themselves twice. See the further reading at the end of this chapter.","type":"paragraph"}],"code":"HSP-C04-LS-02","order":2,"title":"Why this matters"},{"blocks":[{"id":"5c2db2ab-daa1-5f9d-8b09-ff73af4b69ae","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"You work on the Grand Serenata Hotel guest-services hotline.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":389,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"1a4a97aea124dc5ab83f0b9c3e34a90ad8a1f0a6acae66278bedc6cea675263a"},"text":"You work on the Grand Serenata Hotel guest-services hotline.","type":"heading"},{"id":"c6e9e9cf-4f38-514f-a6bd-2bef0ef85ac4","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Guests call from their rooms and from outside for room service, small requests, and quick questions. Calls come in quickly, so you need to be efficient, accurate, and still genuinely warm. Your job flows in a natural order:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":390,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"102fdb9b673eb358a5ffa7dd41f751c89e27492283bb91393e41ca2245665f2f"},"text":"Guests call from their rooms and from outside for room service, small requests, and quick questions. Calls come in quickly, so you need to be efficient, accurate, and still genuinely warm. Your job flows in a natural order:","type":"paragraph"},{"id":"de0cdf72-eed3-5dde-98ed-88e9a949e774","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Answer","underline":false},{"bold":false,"italic":false,"text":" and find out who is calling and from which room.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":391,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"7244612e82fdca7d81f452b499f5ed2393e18a87adc1f7b47734cf30d9ec0be5"},"text":"Answer and find out who is calling and from which room.","type":"list_item"},{"id":"143a500b-469a-52cc-8541-46dc050f35ff","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Take","underline":false},{"bold":false,"italic":false,"text":" the order or request carefully.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":392,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"b6d618285eee8d2a4f150b4848ddf7392a0de83f3e0582c703529f8458e72a0a"},"text":"Take the order or request carefully.","type":"list_item"},{"id":"baf02637-46c4-5d27-b014-01201290406e","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Read it back","underline":false},{"bold":false,"italic":false,"text":" so both of you are sure it is right.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":393,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"47802fcdb91f8b0f702d10c5936f2ea6ae1f4114c6d7135454cb7e669e403354"},"text":"Read it back so both of you are sure it is right.","type":"list_item"},{"id":"1138c9ba-263e-57b0-aa0b-7e2ccb3aac50","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Transfer","underline":false},{"bold":false,"italic":false,"text":" the call to the right department if it is needed.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":394,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"cb8144ed34bc0345d5a8d4766055dd4ee4da0da7b68e687cc221d4eb4ccdb027"},"text":"Transfer the call to the right department if it is needed.","type":"list_item"},{"id":"a43a009b-46c3-5ac9-8c6d-5b09e295cf7d","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Give","underline":false},{"bold":false,"italic":false,"text":" a clear time or next step, then close kindly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":395,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"561d2671ba1e15cbdad25802902936e71cebbdde49d903a8becdc3b62ba743bf"},"text":"Give a clear time or next step, then close kindly.","type":"list_item"},{"id":"10af1003-dc0c-5f9a-b635-b3a3d617ef15","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"When you always listen, then read back, then confirm the time, speed takes care of itself.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":396,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 1. The scenario"],"normalized_text_sha256":"14c35efb393530466b25eb9d7d919fcf1822113de401074e6cf6b7daad65f1e0"},"text":"When you always listen, then read back, then confirm the time, speed takes care of itself.","type":"paragraph"}],"code":"HSP-C04-LS-03","order":3,"title":"Step 1. The scenario"},{"blocks":[{"id":"ffafec12-95dd-5089-81a8-e110978283ca","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Read each example out loud once. Saying it is the quickest way to remember it.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":399,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 2. Key vocabulary"],"normalized_text_sha256":"76c076b1536696db6aa24f33d35148977e5cdfeb40d8235284f37957bc7e5f78"},"text":"Read each example out loud once. Saying it is the quickest way to remember it.","type":"instruction"},{"caption":"Step 2. Key vocabulary: Word or phrase / What it means / How you might say it","header":["Word or phrase","What it means","How you might say it"],"id":"f9c71e7f-26bd-5191-85c0-d388dbb4b5b3","language":"en","order":2,"provenance_kind":"source_verbatim","rows":[["hotline","a direct service phone line","“Please call the guest-services hotline.”"],["room service","food or drinks brought to the room","“I would like to order room service.”"],["to place an order","to request items","“May I place an order, please?”"],["to read back","to repeat an order to confirm it","“Let me read that back to you.”"],["to transfer","to pass the call to a department","“I will transfer you to housekeeping.”"],["department","a section of the hotel","“Which department do you need?”"],["estimated time","how long something will take","“The estimated time is about twenty minutes.”"],["on its way","coming soon","“Your order is on its way.”"],["to follow up","to check back a little later","“I will follow up shortly.”"],["right away","immediately","“I will send someone right away.”"],["courtesy call","a friendly check-in call","“This is just a courtesy call to confirm.”"],["customer-centered","focused on the guest’s needs","“We take a customer-centered approach.”"]],"source_locator":{"artifact":"Hospitrainity.docx","body_index":400,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 2. Key vocabulary"],"normalized_text_sha256":"718aea4427f0ee2c25fb9cf782ed2d44531ce0d7da1b060e509f8292cad04862"},"type":"source_table"},{"id":"f75f3bcd-7f57-55e1-94c1-f94274ca2252","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Order-taking tip: for amounts and room numbers, say each digit on its own, so room 305 becomes “three, oh, five.” It feels slower for a second, but it saves you from sending two coffees to the wrong room.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":401,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 2. Key vocabulary"],"normalized_text_sha256":"f3d2dfb736da4ab5e920170315440431048f5e1652e3e62606d2dabd05b51916"},"text":"Order-taking tip: for amounts and room numbers, say each digit on its own, so room 305 becomes “three, oh, five.” It feels slower for a second, but it saves you from sending two coffees to the wrong room.","type":"paragraph"}],"code":"HSP-C04-LS-04","order":4,"title":"Step 2. Key vocabulary"},{"blocks":[{"id":"29aed95b-cc5b-57eb-b5db-2922a415cdc6","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Answering the hotline","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":404,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. -8d31ff4119e2","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Busy does not have to sound busy. A few small habits keep you calm and kind:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":420,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"b409b47b425c6d4ed95cbef5f9395baae3b76a17e35403741bd0dc007cf416d7"},"text":"Busy does not have to sound busy. A few small habits keep you calm and kind:","type":"paragraph"},{"id":"bf04922b-9515-52f8-8ce5-f7976f3e2183","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Take a slow breath before you answer. Your voice follows your breath.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":421,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"46d3a04ce6a1791b304cda6760b9b2c2f95713791c2003eb637c602793b994ab"},"text":"Take a slow breath before you answer. Your voice follows your breath.","type":"list_item"},{"id":"d8b32354-e6e2-5100-953e-08122626d50d","language":"en","order":18,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Never let the guest hear that you are rushed. A hurried tone makes them feel like a bother.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":422,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"62f67e6c77916cce51c8ba6d6eb72a746cea5845798e5ce934612473d7ca5c83"},"text":"Never let the guest hear that you are rushed. A hurried tone makes them feel like a bother.","type":"list_item"},{"id":"60648c31-5ca0-5875-9457-084ced849731","language":"en","order":19,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Use warm little signals, such as “of course” and “right away,” so they feel looked after.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":423,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"92ffb20f3308da71c60312462d4d9f79398cd8e5ea55320aae190d3271a120bc"},"text":"Use warm little signals, such as “of course” and “right away,” so they feel looked after.","type":"list_item"},{"id":"8f712686-f975-5b4c-a568-33231ee8e3c2","language":"en","order":20,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Always read the order back, even when you are sure. It takes five seconds and saves five minutes.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":424,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"ebf775f36c50a0c10361166e559cff5a86e6ab9e325668ac0ae3e05736d7dae8"},"text":"Always read the order back, even when you are sure. It takes five seconds and saves five minutes.","type":"list_item"}],"code":"HSP-C04-LS-05","order":5,"title":"Step 3. Useful phrases, grouped by what they do"},{"blocks":[{"id":"9661c7ce-173d-5b26-b567-4951a08ccaff","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A","underline":false},{"bold":false,"italic":false,"text":" stands for Agent, and ","underline":false},{"bold":true,"italic":false,"text":"G","underline":false},{"bold":false,"italic":false,"text":" stands for Guest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":427,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 4. Model dialogue"],"normalized_text_sha256":"105dad194a3d80b8f04a173869296f37792436ffa714dd0ea09e7c89b9838afe"},"text":"A stands for Agent, and G stands for Guest.","type":"paragraph"},{"id":"4567a59d-996d-5edc-b92a-bd0f8f69b69c","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Guest services, Grand Serenata Hotel. How may I help you?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Hi, I would like to order some food to my room.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Of course. May I have your room number, please?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" Room 305.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Thank you. May I take your order?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" One club sandwich and a pot of tea, please.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Certainly. Let me read that back to you: one club sandwich and one pot of tea, to room 305. Would you like anything else?","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"G:","underline":false},{"bold":false,"italic":false,"text":" No, that is all.","underline":false},{"bold":false,"italic":false,"text":"\n","underline":false},{"bold":true,"italic":false,"text":"A:","underline":false},{"bold":false,"italic":false,"text":" Lovely. That will be about twenty minutes, and it is on its way shortly. Thank you for calling guest services, and enjoy your evening.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":428,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 4. Model dialogue"],"normalized_text_sha256":"e5aea2c7052abf493bdda48d125046a07a130151cb5b460b1f0781b5f9b7f286"},"text":"A: Guest services, Grand Serenata Hotel. How may I help you?\nG: Hi, I would like to order some food to my room.\nA: Of course. May I have your room number, please?\nG: Room 305.\nA: Thank you. May I take your order?\nG: One club sandwich and a pot of tea, please.\nA: Certainly. Let me read that back to you: one club sandwich and one pot of tea, to room 305. Would you like anything else?\nG: No, that is all.\nA: Lovely. That will be about twenty minutes, and it is on its way shortly. Thank you for calling guest services, and enjoy your evening.","type":"paragraph"},{"id":"8cb7cba4-112c-5859-8f7e-deefb77b99e1","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Notice the rhythm: find the room, take the order, read it back, then give a time. Four calm beats, and the call is done in under a minute with nothing left to chance.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":429,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 4. Model dialogue"],"normalized_text_sha256":"87b54d04d32d44b8a959d445c6e4f13034efeebf01b59375bb3c0957dc23e7e7"},"text":"Notice the rhythm: find the room, take the order, read it back, then give a time. Four calm beats, and the call is done in under a minute with nothing left to chance.","type":"paragraph"}],"code":"HSP-C04-LS-06","order":6,"title":"Step 4. Model dialogue"},{"blocks":[{"id":"378579f5-1924-54f7-840c-e23e66d2b186","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Open for five common mistakes","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":432,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"a433b254794ec760d8fec78cc3f476ae28f47f15bd12cd32be5e9d650aac6f83"},"text":"Open for five common mistakes","type":"paragraph"},{"id":"cbba48d7-2e38-5815-8c2d-7a6068089b91","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Taking the order before getting the room number. Get the room first, so nothing is lost if the call drops.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":433,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"eb935c3b355726fba6147d80854d2ec268af7987ec02b0a07df3e43c4b35baf5"},"text":"Taking the order before getting the room number. Get the room first, so nothing is lost if the call drops.","type":"list_item"},{"id":"6fb2f092-92cd-5922-a372-e01a46ef513c","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Skipping the read-back because you feel rushed. This is exactly when mistakes happen.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":434,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"9814ddc2d6a7b277261452da764eae60b58c5eb63ea8e5707170105fb982e6de"},"text":"Skipping the read-back because you feel rushed. This is exactly when mistakes happen.","type":"list_item"},{"id":"8fd4f9da-f530-5909-b0fa-7ec417b45000","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Sounding impatient. A hurried tone tells the guest they are interrupting you.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":435,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"83c19de5e16b7b94c19b0487864879ebe8f92ac436a69145a8bde78f0f4499a9"},"text":"Sounding impatient. A hurried tone tells the guest they are interrupting you.","type":"list_item"},{"id":"d09fd5c2-71e1-52f6-9fdf-3000cfa87b93","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Transferring silently. Always say who you are connecting them to and why.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":436,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"6d2fbbc26cadead2dc7cd89186fe02aba9112cadc23629b0ff7a04c894358590"},"text":"Transferring silently. Always say who you are connecting them to and why.","type":"list_item"},{"id":"2501b910-674a-5acd-b5bd-8924de8b4d90","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Forgetting the estimated time. Guests relax when they know how long to wait.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":437,"chapter":4,"heading_path":["The Guest-Services Hotline","Common mistakes to avoid"],"normalized_text_sha256":"9373e137ac77462fb892bec14725e03b7c720d0d5b2196bf8d29a287ae56d724"},"text":"Forgetting the estimated time. Guests relax when they know how long to wait.","type":"list_item"}],"code":"HSP-C04-LS-07","order":7,"title":"Common mistakes to avoid"},{"blocks":[{"id":"3b536124-5ae1-5e12-98a7-3da6c7cd8d26","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Try each one first, then open the toggle to check yourself.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":440,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 5. Practice"],"normalized_text_sha256":"457b0ccffe30e2688e9b4bddc363e158e25bcf32152f3bdb3c034c9407006a63"},"text":"Try each one first, t S-08","order":8,"title":"Step 5. Practice"},{"blocks":[{"id":"918401e6-a6af-561b-8955-1ec65164f0ea","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guided mode (pick the best response, then check)","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":455,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"8b5c1e17e91dac6eca1351f72f3ad5c3f74412725d84779192885e8a7d4310a7"},"text":"Guided mode (pick the best response, then check)","type":"heading"},{"id":"41f36151-7968-5ffd-8740-71b4590f58e5","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “Can you send someone to fix the air conditioning?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":456,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"73fc14d81669cbb8ed897f4ac260a66cabbe9def3036817b47e2d892bf998d16"},"speaker":"Guest","text":"“Can you send someone to fix the air conditioning?”","type":"dialogue_turn"},{"id":"9a3ed525-3081-50f1-8e50-7ba77ca678d2","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":457,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"8ec03963-a7b7-5484-bcec-5ee479ab7b3a","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “That is not my department.” Unhelpful, and it leaves the guest stuck.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":458,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"76c78fc16e7710e5e3a956027a5298819704d402f754bb07c57dd5f53ea339d5"},"text":"(a) “That is not my department.” Unhelpful, and it leaves the guest stuck.","type":"paragraph"},{"id":"215ecfa7-9b8a-5d71-af42-56db1e3e4f44","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “I am sorry to hear that. I will put you through to maintenance right away. One moment, please.” This is the ideal answer, empathy followed by action.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":459,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"8a4309a5e34079b3a82cbde863119c6c6942fa08610098fb224c64b404241635"},"text":"(b) “I am sorry to hear that. I will put you through to maintenance right away. One moment, please.” This is the ideal answer, empathy followed by action.","type":"paragraph"},{"id":"5da3ad33-b193-5839-bd1e-92e713819278","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “Try turning it off and on.” This pushes the work back onto the guest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":460,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"40d0aaf7dd2dec94e81b68912119f4904dbd9328f0f7c5ea6a2292050ac64d40"},"text":"(c) “Try turning it off and on.” This pushes the work back onto the guest.","type":"paragraph"},{"id":"a5441693-1a38-5e82-95d8-16fd818cf69a","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “I would like two coffees and a sandwich, quickly please, I am in a hurry.”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":461,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"e90844e9ebe10096f1c6d5c486c82d7cb73830a7e0ac578a8fc153eec393027b"},"speaker":"Guest","text":"“I would like two coffees and a sandwich, quickly please, I am in a hurry.”","type":"dialogue_turn"},{"id":"914f7de6-fac0-594c-8e92-09dee6d4cc00","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":462,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"2b8c2163-d8f5-58f5-ba2c-55a21c07865e","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “Everyone is in a hurry.” Dismissive and cold.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":463,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"90094e98b40a69eb6180c451ec6682df424e893219d38e6e3f90b86cbc13a0df"},"text":"(a) “Everyone is in a hurry.” Dismissive and cold.","type":"paragraph"},{"id":"0b5b6306-cd22-5599-8751-0d83ddb25e71","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Of course. That is two coffees and one sandwich to your room. May I have your room number? It will be about fifteen minutes.” This is the ideal answer, fast, accurate, and warm.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":464,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"6e577b252452ddf6e3123df38a78ebee3c2c8f8195edf42f91a13cef0e7f4c69"},"text":"(b) “Of course. That is two coffees and one sandwich to your room. May I have your room number? It will be about fifteen minutes.” This is the ideal answer, fast, accurate, and warm.","type":"paragraph"},{"id":"44b7e53f-c5a9-5204-9bbd-f9c33e70142c","language":"en","order":11,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “We will see.” Vague and discouraging.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":465,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"8ec7cce7ee228f2c2fdc6eeb1ab1301499cd186f2f44bcfe61848d8f24f86a77"},"text":"(c) “We will see.” Vague and discouraging.","type":"paragraph"},{"id":"91eb74bf-725d-5075-a55f-17d0f22964e2","language":"en","order":12,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" “Actually, can you connect me to the front desk about my bill?”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":466,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"8a5bf847a1d9c7d2f5dd61855af309d509deb9f27f1dc607a825cbbb01fb9714"},"speaker":"Guest","text":"“Actually, can you connect me to the front desk about my bill?”","type":"dialogue_turn"},{"id":"83298f20-5c10-5273-a4b8-555b782e2068","language":"en","order":13,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":467,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"726333e8-937d-5f87-b06a-7e1db0520e4e","language":"en","order":14,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “This is room service, not the front desk.” Technically true, but cold.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":468,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"00558d12eecb8ea04ccae673062053c19d1b4be96c9a8db12a0e22ead782c1f6"},"text":"(a) “This is room service, not the front desk.” Technically true, but cold.","type":"paragraph"},{"id":"32759117-a641-5ead-b528-80cf3dc41860","language":"en","order":15,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Of course, I will connect you to the front desk now. One moment, please.” This is the ideal answer, because it transfers the guest warmly and clearly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":469,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"60568eb2049a3a8b24261951ef567335f9dfd9c06d63000d1752684549d47a59"},"text":"(b) “Of course, I will connect you to the front desk now. One moment, please.” This is the ideal answer, because it transfers the guest warmly and clearly.","type":"paragraph"},{"id":"c93bfcdb-e40f-5209-9178-088ef0fdadc1","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “Call them yourself.” Rude and unhelpful.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":470,"chapter":4,"heading_path":["The Guest-Services Hotline","Step 6. Role-play"],"normalized_text_sha256":"c3b031d5ea44d0579ef306458a9e5541c137d78af91fa5ef9bd3040565a5b9d6"},"text":"(c) “Call them yourself.” Rude and unhelpful.","type":"paragraph"},{"id":"79446813-15da-53be-bceb-e014cf351a12","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Free mode (your turn, speak or write your own answer)","underline":false}],"source_locator":{"art ,"normalized_text_sha256":"7831b9b1655261ee807dd6e8e3ddc00ca3104240995c2c77bdaa0c3831fbaad6"},"type":"activity_embed"}],"code":"HSP-C04-LS-11","order":11,"title":"Step 8. Confidence check"},{"blocks":[{"id":"1f756cd7-d7ae-52f4-9b53-e695706da97d","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Here is a quick drill that builds real speed. Have a friend read you a short order and a room number a little faster than feels comfortable, then read it straight back and add an estimated time. Do it three times. This trains the exact reflex a hotline needs, which is to listen, read back, and confirm, all without losing your warmth.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":507,"chapter":4,"heading_path":["The Guest-Services Hotline","Take it further"],"normalized_text_sha256":"96a40289187130c126780d8b5380bff6cbb522631fa10821d60ad831cf547e9c"},"text":"Here is a quick drill that builds real speed. Have a friend read you a short order and a room number a little faster than feels comfortable, then read it straight back and add an estimated time. Do it three times. This trains the exact reflex a hotline needs, which is to listen, read back, and confirm, all without losing your warmth.","type":"paragraph"},{"id":"885337fe-8712-5cab-8755-18f554792736","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Efficiency with a human voice","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":509,"chapter":4,"heading_path":["The Guest-Services Hotline","Take it further"],"normalized_text_sha256":"6ae24efca05450049abd07a82d57ea08bd85a00a29d195bcfeffbc6b756d9bfc"},"text":"Efficiency with a human voice","type":"heading"},{"id":"fc598551-0f7f-5774-9fd3-b1f4cd38a750","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Be efficient, but never let yourself sound 45909f060232732143de6c64b18d67f282d91"},"text":"When you speak, a smile and a kind tone can soften almost anything. In writing, all of that has to come through in the words alone, which is why structure and politeness matter so much. A clear, warm email tells the guest that the hotel is organised and that it cares. A messy or cold one quietly says the opposite, even if every fact in it is correct.","type":"paragraph"},{"id":"69dc417a-54ed-505d-acb3-4c07d020b60b","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Good to know: the strongest professional emails share a few traits. They are prompt, clear, empathetic, and easy to act on. Keep those four words in mind and your replies will almost write themselves. See the further reading at the end of this chapter.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":532,"chapter":5,"heading_path":["Customer Care Through Writing","Why this matters"],"normalized_text_sha256":"2a68aaa36f7126b956c1392e38e9ddff0b24630f4ca99ec5af226f8e98e75df2"},"text":"Good to know: the strongest professional emails share a few traits. They are prompt, clear, empathetic, and easy to act on. Keep those four words in mind and your replies will almost write themselves. See the further reading at the end of this chapter.","type":"paragraph"}],"code":"HSP-C05-LS-02","order":2,"title":"Why this matters"},{"blocks":[{"id":"05f35bf0-8d8c-5dea-ad43-3d8d56a414ba","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"You look after the email inbox at the Grand Serenata Hotel.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":535,"chapter":5,"heading_path":["Customer Care Through Writing","Step 1. The scenario"],"normalized_text_sha256":"cb7a5bc383010ac697e6fd28b96a12c3e9b5e1b04ff0ff34a79f22bd7c793cf0"},"text":"You look after the email inbox at the Grand Serenata Hotel.","type":"head you.","type":"list_item"},{"id":"0ca8bf1a-7427-5fa8-b212-71c6a85e1da7","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Body","underline":false},{"bold":false,"italic":false,"text":", where the information sits, clearly ","underline":false},{"bold":false,"italic":false,"text":"organised","underline":false},{"bold":false,"italic":false,"text":".","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":539,"chapter":5,"heading_path":["Customer Care Through Writing","Step 1. The scenario"],"normalized_text_sha256":"9b7735357a75d1585d42d624f132a5b720809f4595b7b2c35a0e13f278793372"},"text":"Body, where the information sits, clearly organised.","type":"list_item"},{"id":"8c7f9964-81f9-5185-9fa7-8b9e14a9b0bf","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Closing","underline":false},{"bold":false,"italic":false,"text":", which offers a little more help.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":540,"chapter":5,"heading_path":["Customer Care Through Writing","Step 1. The scenario"],"normalized_text_sha256":"8a06149fae96e10571f467ea20c1ef08b750ff0c109c8e27158ca7dbc5b9a1b1"},"text":"Closing, which offers a little more help.","type":"list_item"},{"id":"1bb20c8d-dcc0-580d-992f-5b225f11e5df","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Sign-off","underline":false},{"bold":false,"italic":false,"text":", such as “Kind regards,” followed by your name.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":541,"chapter":5,"heading_path":["Customer Care Through Writing","Step 1. The scenario"],"normalized_text_sha256":"4359aa522c23847ef88504ae8ab84c81e1878229b0db751a4aea7771aed342c2"},"text":"Sign-off, such as “Kind regards,” followed by your name.","type":"list_item"},{"id":"fc689c74-298b-58f2-a6bb-401eac22e5e4", ttachment below.”"],["to look forward to","a warm, polite way to mention the future","“We look forward to welcoming you.”"],["prompt reply","a quick response","“Thank you for your prompt reply.”"],["body","the main part of the message","“Keep the body clear and short.”"],["to apologise","to say sorry sincerely","“We apologise for the inconvenience.”"],["please do not hesitate","a warm offer of further help","“Please do not hesitate to contact us.”"],["subject line","the short title of the email","“Write a clear subject line.”"]],"source_locator":{"artifact":"Hospitrainity.docx","body_index":546,"chapter":5,"heading_path":["Customer Care Through Writing","Step 2. Key vocabulary"],"normalized_text_sha256":"616af378776b0d4ebb54281a11240dc1c3e0dba90b4704aafd73bf5fc2c9d4e2"},"type":"source_table"},{"id":"ae63884d-7fce-5c86-965b-53a10d3fdf6d","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Register in one line: formal writing uses full words and titles, such as “Dear Mr. Chen” and “I would be happy to help.” Casual writing uses short forms and slang, such as “Hey” and “no worries.” With guests, lean formal and warm. You can always soften a formal message, but a too-casual one is hard to take back.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":547,"chapter":5,"heading_path":["Customer Care Through Writing","Step 2. Key vocabulary"],"normalized_text_sha256":"373bea3bbb6b5eb82912d37b33dd6cbdd949ea22d5a67c99d539d5053f7adec2"},"text":"Register in one line: formal writing uses full words and titles, such as “Dear Mr. Chen” and “I would be happy to help.” Casual writing uses short forms and slang, such as “Hey” and “no worries.” With guests, lean formal and warm. You can always soften a formal message, but a too-casual one is hard to take back.","type":"paragraph"}],"code":"HSP-C05-LS-04","order":4,"title":"Step 2. Key vocabulary"},{"blocks":[{"id":"ad90d392-7d4c-5523-9879-04a244c60b ","runs":[{"bold":false,"italic":false,"text":"A model version: “Dear Sir or Madam, I would like to ask whether you have any rooms available this weekend. Thank you.” Notice the formal greeting, the full words, and the polite tone.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":594,"chapter":5,"heading_path":["Customer Care Through Writing","Step 5. Practice"],"normalized_text_sha256":"b6b49fad58c26d862f8a1a81bb176178b0722e25f2db6dd9015044b431b68aec"},"text":"A model version: “Dear Sir or Madam, I would like to ask whether you have any rooms available this weekend. Thank you.” Notice the formal greeting, the full words, and the polite tone.","type":"paragraph"},{"id":"7dc33464-1f93-57a4-81ff-206ce7162ab9","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"2. Choose the right sign-off for a formal reply:","underline":false},{"bold":false,"italic":false,"text":" (a) “xoxo” or (b) “Kind regards,” or (c) “later!”","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":595,"chapter":5,"heading_path":["Customer Care Through Writing","Step 5. Practice"],"normalized_text_sha256":"6666ad7b2f628360cafbc91fd7f83df6a88bbffe17d65b07ff6f2834d7cc9d67"},"text":"2. Choose the right sign-off for a formal reply: (a) “xoxo” or (b) “Kind regards,” or (c) “later!”","type":"list_item"},{"id":"617c0afc-25d9-5f07-87d2-0f833c7dbecb","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Check answer","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":596,"chapter":5,"heading_path":["Customer Care Through Writing","Step 5. Practice"],"normalized_text_sha256":"59b5b25c3f1225bbc759f0a5877604948e64e3484f2e56aafef146d98cd32a61"},"text":"Check answer","type":"paragraph"},{"id":"f3ddab21-e920-5c69-a7c9-268dc50afe2a","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true, c-577e-9595-b3c5bcdda99e","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":608,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"896a4c26-1e67-5a40-a74e-50a7c4ca8e9a","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “Yes.” Too short, and it answers only half of the question.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":609,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"6b865ce9d70c616c212fc2a8f59974e0524f11b5a571ddd06699f34300d684f0"},"text":"(a) “Yes.” Too short, and it answers only half of the question.","type":"paragraph"},{"id":"f0d55ec8-431b-5980-85ec-17c201157708","language":"en","order":5,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Dear Guest, thank you for your enquiry. Yes, we have a Double Room available this weekend at 90 dollars per night, breakfast included. Please let us know if you would like to book. Kind regards, Maya.” This is the ideal answer, complete, tidy, and warm.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":610,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"43afe658002d3ac900e9c16fe400fdc30d266e7ca5cbee76a42e0714636cf558"},"text":"(b) “Dear Guest, thank you for your enquiry. Yes, we have a Double Room available this weekend at 90 dollars per night, breakfast included. Please let us know if you would like to book. Kind regards, Maya.” This is the ideal answer, complete, tidy, and warm.","type":"paragraph"},{"id":"9f4e173d-8b64-5984-93cf-0b265528675d","language":"en","order":6,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “idk, check the website.” Unhelpful and far too casual.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":611,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"ff5fb1c9f5bd2ace45c4ed5650e3d440f121cc99f0801a40ac6f16e473b868da"},"text":"(c) “idk, check the website.” Unhelpful and far too casual.","type":"paragraph"},{"id":"ef61e3e8-41dd-5810-804d-61c38d4e3753","language":"en","order":7,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A guest writes an upset email about being charged twice.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":612,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"a9ca68fd1d43384f0269e1309bcd43e0b5134fe6643cff492126c816a5a07a79"},"text":"A guest writes an upset email about being charged twice.","type":"heading"},{"id":"b092fe02-62f3-5960-92d2-d9e98410913a","language":"en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":613,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"535fd26f-fb42-51ae-a9a0-ea144f7c6224","language":"en","order":9,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) No reply at all. Silence makes the situation worse.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":614,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"e6d3ef104841a44534858182f32329b8dde60d89e6ba967420f357f8e7170ad1"},"text":"(a) No reply at all. Silence makes the situation worse.","type":"paragraph"},{"id":"1e49d1e2-f431-529b-a869-06b250472d5b","language":"en","order":10,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Dear Mr. Chen, thank you for letting us know, and please accept our sincere apologies. We have reviewed your bill and are correcting the duplicate charge now. The refund should appear within three to five days. Kind regards, Maya.” This is the ideal answer, an apology, ownership, and a clear action.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":615,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"2c98b1aec060a735ba8c06b823fea2f928e91dee29c635bed268ca93b85c7b16"},"text":"(b) “Dear Mr. Chen, thank you for letting us know, and please accept our sincere apologies. We have reviewed your bill and are correcting the duplicate charge now. The refund should appear within three to five days. Kind regards, Maya.” This is the ideal answer, an apology, ownership, and a clear action.","type":"paragraph"},{"id":"1f59fd99-d830-5c41-8141-52e405f180bf","language":"en","order":11,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “That is not our fault.” Defensive and cold, and it will only anger the guest further.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":616,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"db46fe2ebf69afa24f5053fbaa70b511d04e45160d86b9df9e3428411862a686"},"text":"(c) “That is not our fault.” Defensive and cold, and it will only anger the guest further.","type":"paragraph"},{"id":"5195fd54-27ab-5953-9c3c-d1798eb5c3fe","language":"en","order":12,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"A guest writes to ask for a late check-out.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":617,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"f2616e6b1dfa9ae1df5bd64f17b5198818ee3a18eb376917e547ceb69ee4b365"},"text":"A guest writes to ask for a late check-out.","type":"heading"},{"id":"7cc3fbff-240a-5038-b3f9-e52972f578c2","language":"en","order":13,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reveal the options and feedback","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":618,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"6dc878d750298bcb4a4f27b0ad5920cbcec919db017ef2f3a46fa28770873d4e"},"text":"Reveal the options and feedback","type":"paragraph"},{"id":"0763ce7b-7335-5dbc-bf9a-308fffae252c","language":"en","order":14,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(a) “No.” Blunt and unfriendly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":619,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"e94dbc7a3377604e3d7c6358825993760ce1ec3c5cc62508635005b7e82b9141"},"text":"(a) “No.” Blunt and unfriendly.","type":"paragraph"},{"id":"3a3531e0-e65d-5853-85fd-9b6d8ad74e9f","language":"en","order":15,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(b) “Dear Ms. Putri, thank you for your message. We would be happy to offer a late check-out until 2 in the afternoon at no extra charge. Please let us know if that suits you. Kind regards, Maya.” This is the ideal answer, warm, clear, and helpful.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":620,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"15ef729fa45bf39c64f4beb09720ebc2b5b08bb1e7c6e4ddbb435e6d6b399570"},"text":"(b) “Dear Ms. Putri, thank you for your message. We would be happy to offer a late check-out until 2 in the afternoon at no extra charge. Please let us know if that suits you. Kind regards, Maya.” This is the ideal answer, warm, clear, and helpful.","type":"paragraph"},{"id":"40f8cd0c-fd0e-5b2c-968d-438515a12c5a","language":"en","order":16,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"(c) “That depends.” Vague, and it leaves the guest unsure.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":621,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"f9a8085d02db34c792b615cfe27a408dfb85eefebfb54ae76e77d812f0528fc7"},"text":"(c) “That depends.” Vague, and it leaves the guest unsure.","type":"paragraph"},{"id":"13d07662-2858-5384-80f7-42362a25318e","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Free mode (your turn, write your own reply)","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":622,"chapter":5,"heading_path":["Customer Care Through Writing","Step 6. Role-play (drafting)"],"normalized_text_sha256":"e10f4c4e0f2167023e6e1fbaae99f99d907f3a8e01f85bfa0988f5d850a91737"},"text":"Free mode (your turn, write your own reply)","type":"heading"},{"id":"3358a5af-5f43-56da-a220-18034e40e493","language":"en","order":18,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Prompt:","underline":false},{"bold":false,"italic":false,"text":" Write a short booking-confirmation email for a guest who reserved one night in a Deluxe Room, arriving next Friday.","underline":false}],"source_locator":{"ar ul."}],"id":"2e6e88ea-e84d-5628-8411-367b8882594f","label":"a","text":"“Maybe.”"},{"feedback":[{"feedback_type":"success","text":"(b) “Of course, I would be happy to help with that. Could you send me your booking reference so I can check availability for Saturday?” This is the ideal answer, warm, and it gathers what is needed privately."}],"id":"94a29543-20a4-520d-8c7f-680070103f2b","label":"b","text":"“Of course, I would be happy to help with that. Could you send me your booking reference so I can check availability for Saturday?”"},{"feedback":[{"feedback_type":"error_specific","text":"(c) “We do not do changes.” Cold, and it shuts the guest down."}],"id":"7838d93f-1d9c-50de-84f7-8f4f62fb965b","label":"c","text":"“We do not do changes.”"}],"code":"HSP-C06-RP-G3","correct_choice_ids":["94a29543-20a4-520d-8c7f-680070103f2b"],"correct_order":[],"feedback":[{"feedback_type":"error_specific","text":"(a) “Maybe.” Vague and unhelpful."},{"feedback_type":"success","text":"(b) “Of course, I would be happy to help with that. Could you send me your booking reference so I can check availability for Saturday?” This is the ideal answer, warm, and it gathers what is needed privately."},{"feedback_type":"error_specific","text":"(c) “We do not do changes.” Cold, and it shuts the guest down."}],"rating_scale":null,"response_constraints":null,"response_form":"selection","scoring_mode":"objective_choice","self_check_required":false,"stem":"DM: “Can I change my booking from Friday to Saturday?”","tokens":[]}],"response_form":"mixed","rubric":{"code":"HSP-C06-RP-RUBRIC","criteria":[{"code":"HSP-C06-RP-RUBRIC-WARMTH","descriptor":"Warm, professional welcome and tone","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C06-RP-RUBRIC-SOLUTION","descriptor":"Offers help and moves toward a concrete solution","levels":["Not yet","Developing","Strong"]},{"code":"HSP-C06-RP-RUBRIC-POLITENESS","descriptor":"Polite, softened language (e.g. \"Could I ... please\")","levels":["Not yet","Devel vice","Warm-Up"],"normalized_text_sha256":"8d61308f2eefb60a8404f7c5bd85c4b6d490fa7a6563d7a27b02e37d52ad1937"},"text":"Have you ever messaged a business on WhatsApp or Instagram? How quickly did they reply, and how did that feel?","type":"list_item"},{"id":"2fc9b111-f0dd-5adb-9c22-41daf0c8787f","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"In your own language, how do you keep a chat message polite but short?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":677,"chapter":6,"heading_path":["Online and Social Media Customer Service","Warm-Up"],"normalized_text_sha256":"aa963cd64407859b8d720eea53e08bedc42e4848774ffd8e06dade879246f377"},"text":"In your own language, how do you keep a chat message polite but short?","type":"list_item"}],"code":"HSP-C06-LS-01","order":1,"title":"Warm-Up"},{"blocks":[{"id":"c2d6eee1-4779-599a-a929-de7ef5cf7f31","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Online messages are often public, or at least easy to screenshot, so every reply is a little advertisement for your hotel. Guests have also grown used to fast service, and their patience online is short. Studies of social media service have found that a large majority of people who reach out expect a reply within an hour, yet only a minority of businesses actually manage it. That gap is your opportunity, because a quick, kind reply genuinely stands out.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":679,"chapter":6,"heading_path":["Online and Social Media Customer Service","Why this matters"],"normalized_text_sha256":"7b12fbfed7562adb1520e63104306760fca665ecd2eed81c7e89d15db6d66eeb"},"text":"Online messages are often public, or at least easy to screenshot, so every reply is a little advertisement for your hotel. Guests have also grown used to fast service, and their patience online is short. Studies of social media service have found that a large majority of people who reach out expect a reply within an hour, yet only a minority of businesses actually manage it. That gap is your opportunity, because a quick, kind reply genuinely stands out.","type":"paragraph"},{"id":"fc788d90-75dc-5236-b26a-a4421caaa440","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Good to know: research suggests that around three quarters of customers who message a brand on social media expect a response within the hour. Speed really is part of the service now. See the further reading at the end of this chapter.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":680,"chapter":6,"heading_path":["Online and Social Media Customer Service","Why this matters"],"normalized_text_sha256":"42ac034d1b1c9a7e062959c0d46832b7d750281fee54a67b806a4f9d5555b2b6"},"text":"Good to know: research suggests that around three quarters of customers who message a brand on social media expect a response within the hour. Speed really is part of the service now. See the further reading at the end of this chapter.","type":"paragraph"}],"code":"HSP-C06-LS-02","order":2,"title":"Why this matters"},{"blocks":[{"id":"e6f5cf83-17c0-5450-8e10-47f3969593bf","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"You look after the Grand Serenata Hotel’s live chat, WhatsApp, and social media messages.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":683,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 1. The scenario"],"normalized_text_sha256":"17d99f0e3b4cb57a0616f350882fd710cd6fe8ba97aa7ab0c543188251c9ec8a"},"text":"You look after the Grand Serenata Hotel’s live chat, WhatsApp, and social media messages.","type":"heading"},{"id":"dce4cb04-7bf7-512f-a16b-5448fb7d0c67","language":"en","order":2,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Guests expect replies that are fast, friendly, and short. You answer questions, handle small concerns, and know when to move a chat to a private channel or pass it to the front desk. The golden rule is to stay warm and professional even in public comments, because everyone can see them. Your job flows in a natural order:","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":684,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 1. The scenario"],"normalized_text_sha256":"0f04d6192babbcbffda486ad9452cec97b8bdf93ea9509e6845a36f5c9fa4af1"},"text":"Guests expect replies that are fast, friendly, and short. You answer questions, handle small concerns, and know when to move a chat to a private channel or pass it to the front desk. The golden rule is to stay warm and professional even in public comments, because everyone can see them. Your job flows in a natural order:","type":"paragraph"},{"id":"91cc12ac-99f2-5165-a7e6-66da9f2a9243","language":"en","order":3,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Greet","underline":false},{"bold":false,"italic":false,"text":" quickly and warmly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":685,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 1. The scenario"],"normalized_text_sha256":"6b6fe6828ea4e4aa1ec8fd1d781017389a13303a95b5cf971aad13fda28b27ec"},"text":"Greet quickly and warmly.","type":"list_item"},{"id":"2517aac2-7fb9-5998-aeb2-a4865c9f0c70","language":"en","order":4,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Answer","underline":false},{"bold":false,"italic":false,"text":" clearly and briefly.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":686,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 1. The scenario"],"normalize "en","order":8,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Where an automated chatbot fits in.","underline":false},{"bold":false,"italic":false,"text":" A chatbot can answer common questions instantly, day and night, such as the check-in time, the Wi-Fi password, and breakfast hours. That frees you to spend your time on the messages that really need a human touch. It sits naturally alongside a human team, handling the routine so people can handle the rest.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":690,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 1. The scenario"],"normalized_text_sha256":"e2b618ed19b5e0d68d0a6e5aa5c59e1647629b21a5ff2ea384ed1f8d78b5bde6"},"text":"Where an automated chatbot fits in. A chatbot can answer common questions instantly, day and night, such as the check-in time, the Wi-Fi password, and breakfast hours. That frees you to spend your time on the messages that really need a human touch. It sits naturally alongside a human team, handling the routine so people can handle the rest.","type":"paragraph"}],"code":"HSP-C06-LS-03","order":3,"title":"Step 1. The scenario"},{"blocks":[{"id":"8e497a35-b81f-5fc8-b6a3-7ac3f0d2acd3","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Read each example out loud once. Saying it is the quickest way to remember it.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":693,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 2. Key vocabulary"],"normalized_text_sha256":"76c076b1536696db6aa24f33d35148977e5cdfeb40d8235284f37957bc7e5f78"},"text":"Read each example out loud once. Saying it is the quickest way to remember it.","type":"instruction"},{"caption":"Step 2. Key vocabulary: Word or phrase / What it means / How you might use it","header":["Word or phrase","What it means","How you might use it"], g paragraphs feel heavy on a phone screen.","type":"list_item"},{"id":"54fa932f-6bbb-5cc2-adac-1b083b43ddfc","language":"en","order":17,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Answer the actual question first, then offer more help.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":715,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"d390c68509c97d31ab42d8b1944a0ad44185914a14a70ffc01af5cc65cecf661"},"text":"Answer the actual question first, then offer more help.","type":"list_item"},{"id":"f24fd056-1965-5d4f-8438-5c02adca18b5","language":"en","order":18,"provenance_kind":"source_verbatim","runs":[{"bold":false,"italic":false,"text":"Reply quickly, even if it is only to say you are looking into it.","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":716,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 3. Useful phrases, grouped by what they do"],"normalized_text_sha256":"627a3834d6927f4a51a64e74bcf074994b13b85e00f7f0f54b10ee781fee4ef6"},"text":"Reply quickly, even if it is only to say you are looking into it.","type":"list_item"}],"code":"HSP-C06-LS-05","order":5,"title":"Step 3. Useful phrases, grouped by what they do"},{"blocks":[{"id":"4121bf4b-749b-523c-9818-f9e32f59a902","language":"en","order":1,"provenance_kind":"source_verbatim","runs":[{"bold":true,"italic":false,"text":"Guest:","underline":false},{"bold":false,"italic":false,"text":" Hi, do you have rooms for this Saturday?","underline":false}],"source_locator":{"artifact":"Hospitrainity.docx","body_index":719,"chapter":6,"heading_path":["Online and Social Media Customer Service","Step 4. Model chat exchange"],"normalized_text_sha256":"9ce58e42aa0b28a1e950437663249b1dca4a495680862f0366ee9327579d2294"},"speaker":"Guest","text":"Hi, do you have rooms for this Saturday?","type":"di
